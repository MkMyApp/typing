<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts の読み込み（出題するフォントをあらかじめインポート） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Sans:wght@400;700&family=Open+Sans:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>フォント名</title>
  </head>
  <body>
    <div id="title"></div>
    <div id="result"></div>
    <div id="target" class="line"></div>
    <textarea id="editor"
      class="line" spellcheck="false">
    </textarea>

    <script>
      const TITLE_MSG = "フォント名";
      const START_MSG = "Enter⏎";
      const INPUT_MSG = "英数 確認";
      const RANDOM = 0; // 出題数 0:順番
      const WIDTH = "25ch";
      const IME = "ON"; // OFF
    </script>

    <!---5----10---15---20---25---30---35---40--->
    <textarea id="txtdata" hidden>
Roboto
Open Sans
Montserrat
Noto Sans
Lato
Poppins
Inter
Playfair Display
    </textarea>
    <!---5----10---15---20---25---30---35---40--->

    <script src="typing.js"></script>

    <!-- typing.js の動作をフックしてフォントを切り替えるスクリプト -->
    <script>
      // 1. セッター（代入）を監視して nextWord などによる変数更新をフックする
      let _currentWord = currentWord;
      Object.defineProperty(window, 'currentWord', {
        get() {
          return _currentWord;
        },
        set(val) {
          _currentWord = val;
          applyFont(val);
        },
        configurable: true,
        enumerable: true
      });

      // 2. スタート時やリセット時にもフォントを初期化・適用する関数
      function applyFont(fontName) {
        const targetEl = document.getElementById('target');
        const editorEl = document.getElementById('editor');
        
        if (fontName && fontName !== START_MSG && !fontName.includes('%')) {
          // フォント名が有効な場合はそのフォントを適用（フォールバックとしてmonospaceを指定）
          const fontVal = `"${fontName}", monospace`;
          targetEl.style.fontFamily = fontVal;
          editorEl.style.fontFamily = fontVal;
        } else {
          // スタート画面や完了画面の時はデフォルトのスタイル（monospace）に戻す
          targetEl.style.fontFamily = '';
          editorEl.style.fontFamily = '';
        }
      }

      // 3. 初期表示やスタート時の処理をフック（showStart や startType の実行を監視・上書き）
      const originalShowStart = window.showStart;
      window.showStart = function() {
        if (typeof originalShowStart === 'function') originalShowStart();
        applyFont('');
      };
    </script>

  </body>
</html>
