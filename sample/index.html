<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
	#frm_type {
  width: 100%;
  height: 480px;
  border: none;
  white-space: normal;
  margin: 0 auto;
  padding: 0px;
}
</style>

<title>ランダムセレクト</title>
</head>
<body>
<iframe id="frm_type"></iframe>
<script>
const menuList = [
'ABC小文字',
'ABC大文字',
'あいう',
'いろは',
'ひらがな',
'初級英単語60',
]

const iframeElement = document.getElementById('frm_type');
let newIndex;
newIndex = Math.floor(Math.random() * menuList.length);
iframeElement.src = menuList[newIndex] + ".html";

</script>
</body>
</html>
