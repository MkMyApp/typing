</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line" style="text-align:center"></div>
<textarea id="editor" class="line" spellcheck="false" rows="1"></textarea>
<script>
const TITLE_MSG = "呪文メーカー";//タイトル
const START_MSG = "Enter⏎スタート";
const INPUT_MSG = "かな　確認";//英数　かな
const IME = "ON";// ON Shift+Enter
const RANDOM = 10;// 出題数
const WIDTH = "20ch";// 入力幅　全角は2倍
</script>
<!---5----10---15---20---25---30---35---40--->
<textarea id="txtdata" hidden>
ちとしはまのりれ
</textarea>
<!---5----10---15---20---25---30---35---40--->
<script src="typing.js"></script>

<script>
const length = 8;// 問題文の長さ
const lines = 100; //生成問題数
generateText();
init();

function generateText() {
  const txtData = document.getElementById('txtdata');

  const chars = txtData.value.replace(/[\n\r\s]/g, "");
  let result = "";
  for (let i = 0; i < lines; i++) {
    let line = "";
    for (let j = 0; j < length; j++) {
      line += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    result += line + (i < lines - 1 ? "\n" : "");
  }
  txtData.value = result;
}
</script>

<script>
// 表示・非表示を制御する関数（引数で指定）

const textarea = document.getElementById('txtdata');
textarea.style.display = 'none';

function setTextarea(isVisible) {
  if (isVisible) {
  	textarea.value = "";
    textarea.style.display = 'block';
    textarea.focus();
  } else {
    textarea.style.display = 'none';
    generateText();
    init();
		typeStarted = false
		composing = false
		finished = false
  }
}

// ドキュメント全体のイベントリスナー
document.addEventListener('keydown', function(event) {
　//Escape Fn
  if (event.key === 'F2') {
    event.preventDefault();
    const textarea = document.getElementById('txtdata');
    if (!textarea) return;

    // 現在の表示状態を反転させて引数に渡す
    const isHidden = (textarea.style.display === 'none');
    setTextarea(isHidden);
  }
});
</script>
</body>
