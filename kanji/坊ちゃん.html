親譲りの無鉄砲で
小供の時から損ばかりしている。
小学校に居る時分
学校の二階から飛び降りて
一週間ほど腰を抜かした事がある。
なぜそんな無闇をしたと
聞く人があるかも知れぬ。
別段深い理由でもない。
新築の二階から首を出していたら、
同級生の一人が冗談に、
いくら威張っても、
そこから飛び降りる事は出来まい。
弱虫やーい。と囃したからである。
小使に負ぶさって帰って来た時、
おやじが大きな眼をして
二階ぐらいから飛び降りて
腰を抜かす奴があるかと云ったから、
この次は抜かさずに
飛んで見せますと答えた。

「坊ちゃん」 夏目漱石
夏目漱石の代表作の一つである『坊っちゃん』は、1906年（明治39年）に発表された国民的な人気を誇る小説です。
主人公の「坊っちゃん」は、江戸っ子気質で曲がったことが大嫌いな、血気盛んな青年です。物理学校（現在の東京理科大学）を卒業後、四国の松山にある中学校に数学教師として赴任します。
しかし、赴任先の学校は「赤シャツ（教頭）」や「野だいこ（画学教師）」といった卑怯で計算高い大人たちが支配する、狸の穴のような場所でした。正義感の強い坊っちゃんは、同期の「山嵐（数学主任）」とともに、腐敗した学校社会に真っ向から立ち向かっていきます。
