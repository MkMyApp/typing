或春の日暮です。
唐の都洛陽の西の門の下に、
ぼんやり空を仰いでいる、
一人の若者がありました。
若者は名を杜子春といって、
元は金持の息子でしたが、
今は財産を費い尽して、
その日の暮しにも困る位、
憐な身分になっているのです。
何しろその頃洛陽といえば、
天下に並ぶもののない、
繁昌を極めた都ですから、
往来にはまだしっきりなく、
人や車が通っていました。
門一ぱいに当っている、
油のような夕日の光の中に、
老人のかぶった紗の帽子や、
土耳古の女の金の耳環や、
白馬に飾った色糸の手綱が、
絶えず流れて行く容子は、
まるで画のような美しさです。
