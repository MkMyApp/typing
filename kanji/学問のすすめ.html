「天は人の上に人を造らず
人の下に人を造らず」と言えり。
されば天より人を生ずるには、
万人は万人みな同じ位にして、
生まれながら貴賤上下の差別なく、
万物の霊たる身と心との働きをもって
天地の間にあるよろずの物を資り、
もって衣食住の用を達し、
自由自在、互いに人の妨げをなさずして
おのおの安楽に
この世を渡らしめ給うの趣意なり。
されども今、
広くこの人間世界を見渡すに、
かしこき人あり、おろかなる人あり、
貧しきもあり、富めるもあり、
貴人もあり、下人もありて、
その有様雲と泥との相違あるに
似たるはなんぞや。
その次第はなはだ明らかなり。
「実語教」に、
「人学ばざれば智なし、
智なき者は愚人なり」とあり。
されば賢人と愚人との別は
学ぶと学ばざるとによりて
できるものなり。
