<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
  <link rel="stylesheet" href="addText.css">
	<title>問題追加</title>
</head>
<body>

<div id="setBox">
  <h1>問題追加</h1>
	<div class="input-container">
	  <input type="text" id="inpStr"placeholder="追加する文字列を入力">
	  <button class="Btn-add" onclick="addText()">追加</button>
	</div>
	
  <div class="btn-container">
    <button class="Btn" onclick="clrText()">消去</button>
    <button class="Btn" onclick="loadFile()">読込</button>
    <button class="Btn" onclick="saveFile()">保存</button>
  </div>

  <textarea id="txtdata" placeholder="問題文を入力"></textarea>
</div>

<script src="addText.js"></script>
</body>
</html>
