テキストエディタを使って
<a href="type.html" download>type.html</a>を編集
別の名前をつけて保存する。

TITLE_MSG  問題のタイトル
START_MSG  開始方法
INPUT_MSG  かな漢字変換の確認
RANDOM     ランダム出題の問題数　0は全行順番
WIDTH      入力欄の幅
IME        入力完了の操作 'ON'Shift+Enter 'OFF'Enter
