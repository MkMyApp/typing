<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>タイピング練習</title>

	<link href="mystyle.css" rel="stylesheet" type="text/css" id="set">

<body>
<header>
<h1>タイピング練習</h1>
<span style="text-align:center;">
<h2>タイピング練習を作って自分のパソコンで練習</h2>
</span>
</header>
<main>
<div class="box" style="font-size:150%;">
<h3>タイピング練習の問題を作成</h3>
<a href="type_set/text.html">text.html</a>やテキストエディタを使って<br>
<a href="type.html" download>type.html</a>を編集<br>
別の名前をつけて保存する。<br>
<br>
TITLE_MSG  問題のタイトル<br>
START_MSG  開始方法<br>
INPUT_MSG  かな漢字変換の確認<br>
RANDOM     ランダム出題の問題数　0は全行順番<br>
WIDTH      入力欄の幅<br>
IME        入力完了の操作 'ON'Shift+Enter 'OFF'Enter<br>
textarea   問題文字列<br>

</div>

</div>
</main>
<footer style="font-size:200%;text-align:center;">

</p>
</footer>
