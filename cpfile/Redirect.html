<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>
</head>
<body>
    このページは移動しました。<a id="redirect-link" href="https://example.com">クリック</a>
    <script>
        // 3秒待つ
        setTimeout(() => {
            const targetUrl = document.getElementById("redirect-link").href;
            window.location.href = targetUrl;
        }, 3000);
    </script>
</body>
</html>
