<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード</title>
</head>
<body>
<!--   スクーリーンキーボード挿入   -->
<script>const sVal= 2;</script>
<script src="kana_2.js"></script>
<script>
adjustButtonLayout();//2段表示の設定
setTransparent();//機能キーの文字を透過
applyTransparent();//文字色を透過
applyColor(cnv("Z"),"#F29", "#FFF");
applyColor(cnv("X"),"#F60", "#FFF");
applyColor(cnv("C"),"#3A5", "#FFF");
applyColor(cnv("V"),"#F00", "#FFF");
applyColor(cnv("B"),"#F00", "#FFF");
applyColor(cnv("N"),"#00F", "#FFF");
applyColor(cnv("M"),"#00F", "#FFF");
applyColor(cnv(","),"#3A5", "#FFF");
applyColor(cnv("."),"#F60", "#FFF");
applyColor(cnv("/"),"#F29", "#FFF");
applyColor(cnv("_"),"#F29", "#FFF");
</script>
</body>
</html>
