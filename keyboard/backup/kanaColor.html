<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>運指作成</title>
</head>
<body>

<script>const sVal = 2;</script>
<script src="kana.js"></script>
<script src="colorChg.js"></script>

<script>
// 特殊キーの文字を透明化
setTransparent();
// 初期着色設定 (ホームポジション)
applyColor("ち", "#F29", "#FFF");
applyColor("と", "#F60", "#FFF");
applyColor("し", "#3A5", "#FFF");
applyColor("は", "#F00", "#FFF");
applyColor("ま", "#00F", "#FFF");
applyColor("の", "#3A5", "#FFF");
applyColor("り", "#F60", "#FFF");
applyColor("れ", "#F29", "#FFF");
// クリックで色切り替え機能を有効化
enableKeyClickToggle();
</script>
</body>
</html>
