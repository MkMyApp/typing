<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キーボード図キャプチャ（ライブラリ非依存）</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <button id="save-btn">キーボード図を画像保存</button>
  <br>
  <iframe id="keyboard-iframe" src="E最適化.html"></iframe>

  <script>
    document.getElementById('save-btn').addEventListener('click', async function () {
      try {
        const iframe = document.getElementById('keyboard-iframe');
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

        // 1. iframe内の対象要素を取得（IDがない場合は外側のdivやbodyをフォールバック検索）
        let targetElement = iframeDoc.getElementById('keyboard-container');
        
        if (!targetElement) {
          // IDが見つからない場合、iframe内の最初のdivを取得してみる
          targetElement = iframeDoc.querySelector('div') || iframeDoc.body;
          alert('id="keyboard-container" が見つからなかったため、全体をキャプチャします。');
        }

        // 2. 要素のサイズを取得
        const rect = targetElement.getBoundingClientRect();
        const width = rect.width || 800;
        const height = rect.height || 400;

        // 3. iframe内のCSSスタイルを取得して埋め込み用文字列を作成
        let styleString = '';
        Array.from(iframeDoc.styleSheets).forEach(sheet => {
          try {
            Array.from(sheet.cssRules).forEach(rule => {
              styleString += rule.cssText;
            });
          } catch (e) {
            // クロスドメイン制限などで読み込めないスタイルシートはスキップ
          }
        });

        // 4. HTMLのシリアライズ
        const serializer = new XMLSerializer();
        const htmlString = serializer.serializeToString(targetElement);

        // 5. スタイルを含めたSVGの組み立て
        const svgString = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
            <foreignObject width="100%" height="100%">
              <div xmlns="http://www.w3.org/1999/xhtml">
                <style>${styleString}</style>
                ${htmlString}
              </div>
            </foreignObject>
          </svg>
        `;

        // 6. 画像化とダウンロード
        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          
          // 背景を白で塗る（透明防止）
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          
          ctx.drawImage(img, 0, 0);

          const link = document.createElement('a');
          link.download = 'keyboard_map.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          URL.revokeObjectURL(url);
        };

        img.onerror = function (e) {
          console.error('SVG描画エラー:', e);
          alert('画像の変換に失敗しました。外部フォントや画像参照が原因の可能性があります。');
        };

        img.src = url;

      } catch (err) {
        console.error('処理エラー:', err);
        alert('エラーが発生しました: ' + err.message + '\n※ローカルファイルを直接開いている場合（file:///）、ブラウザのセキュリティ制限でブロックされている可能性があります。VSCodeのLive Server等をご利用ください。');
      }
    });
  </script>

</body>
</html>
