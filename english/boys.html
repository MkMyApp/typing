「少年よ、大志を抱け（Boys, be ambitious!）」は、札幌農学校（現・北海道大学）の初代教頭クラーク博士が1877年に去る際、弟子たちに残した言葉です。単に野心を持てという意味ではなく、金銭や名声ではなく「人としてあるべき姿（高い徳）」を求めよという教えで、札幌ではなく北広島市の島松駅逓所で別れ際に語られました。
