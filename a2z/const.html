<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>問題作成</title>
</head>
<body>
<div id="custom">
<div id="setTitle">
	<button id="setButton" onclick="updateSettings()">問題設定</button>
  <label class="voice-label">
    <input id="check" type="checkbox" name="voice" checked> 音声ガイド
  </label>
</div>

	<div id="set">
		題　名：<input type="text" id="TITLE_MSG" value="ABCタッチタイプ"><br>
		開　始：<input type="text" id="START_MSG" value="Enter⏎"><br>
		文字種：<input type="text" id="INPUT_MSG" value="英数　確認"><br>
		問題数：<input type="text" id="RANDOM" value="0">
		文字幅：<input type="text" id="WIDTH" value="12ch">
	</div>
<div id="text">
<textarea id="txtdata">
ここに問題文を入力
複数の文字列を
改行で区切る。
</textarea>
<div id="btnBox">
	<button id="COMP" onclick="composeText()">設定</button>
</div>

<textarea id="txtComp" style="display: none;">
</textarea>
</div>
<script src="custom.js" defer></script>
</body>
</html>
