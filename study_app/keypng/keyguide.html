<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード Canvas描画</title>
<link rel="stylesheet" href="kb.css">
</head>
<body>

<div class="app-wrapper">
  <!-- 設定パネル（文字種別・背景テーマの選択） -->
  <div class="settings-panel">
    <!-- 文字モードの選択 -->
    <div class="setting-group">
      <label for="char-mode">文字種別:</label>
      <select id="char-mode">
        <option value="大文字">大文字</option>
        <option value="シフト">シフト</option>
        <option value="小文字">小文字</option>
        <option value="かな">かな</option>
      </select>
    </div>

    <!-- 背景テーマの選択 -->
    <div class="setting-group">
      <label for="bg-theme">背景テーマ:</label>
      <select id="bg-theme">
        <option value="none">なし（標準）</option>
        <option value="western">洋風</option>
        <option value="japanese">和風</option>
      </select>
    </div>
  </div>

  <!-- キーボード描画用 Canvas -->
  <canvas id="keyboardCanvas"></canvas>

  <!-- インプットフォーム -->
  <div class="control-panel">
    <div class="btn-container-left">
      <div class="color-row">
        <input type="color" class="hex" value="#ff0000"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#ff0000"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#0000ff"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#0000ff"><input type="text" class="str" value="">
        <br>
        <input type="color" class="hex" value="#ff6600"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#33aa55"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#33aa55"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#ff6600"><input type="text" class="str" value="">
        <br>
        <input type="color" class="hex" value="#ff2999"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#ff2999"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#ff2999"><input type="text" class="str" value="">
        <input type="color" class="hex" value="#ff2999"><input type="text" class="str" value="">
        <br>
        <label class="func-label"><input type="checkbox" id="chkTextColor" class="check" checked>文字色</label>
        <label class="func-label"><input type="checkbox" id="chkFunc" class="check" checked>機能キー</label>
      </div>
    </div>
  </div>

  <div class="btn-container">
    <button class="action-btn" onclick="document.getElementById('fileInput').click()">LOAD (.txt)</button>
    <button class="action-btn" onclick="saveTextConfig()">SAVE (.txt)</button>
    <button class="save-btn" onclick="downloadKeyboardImage()">SAVE (.png)</button>
    <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="loadTextConfig(event)">
  </div>
</div>

<script>
// --- 設定値 ---
const sVal = 2; // 拡大倍率

// キー配列と個別の幅 (w) 設定
const keyboardData = [
  [
    {c:"半/全",id:"IME"},
    {c:"1"},{c:"2"},{c:"3"},{c:"4"},{c:"5"},{c:"6"},
    {c:"7"},{c:"8"},{c:"9"},{c:"0"},{c:"-"},{c:"^"},{c:"|"},
    {c:"BS",id:"BS" }
  ],
  [
    {c:"Tab",w:52,id:"Tab"},
    {c:"Q"},{c:"W"},{c:"E"},{c:"R"},{c:"T"},{c:"Y"},
    {c:"U"},{c:"I"},{c:"O"},{c:"P"},{c:"@"},{c:"["},
    {c:"Enter",w:50,id:"Enter" }
  ],
  [
    {c:"CapsLock",w:64,id:"Caps"},
    {c:"A"},{c:"S"},{c:"D"},{c:"F"},{c:"G"},
    {c:"H"},{c:"J"},{c:"K"},{c:"L"},{c:";"},{c:":"},{c:"]"},
    {c:"⏎",w:38,id:"Ent" }
  ],
  [
    {c:"Shift",w:88,id:"LShift"},
    {c:"Z"},{c:"X"},{c:"C"},{c:"V"},{c:"B"},
    {c:"N"},{c:"M"},{c:","},{c:"."},{c:"/"},{c:"_"},
    {c:"Shift",w:52,id:"RShift" }
  ],
  [
    {c:"Ctrl",w:52,id:"LCtrl"},{c:"Win",w:46,id:"LWin"},{c:"Alt",w:46,id:"LAlt"},
    {c:"無変換",w:32,id:"OFF"},{c:" ",w:122,id:"Spc"},{c:"変換",w:32,id:"ON"},
    {c:"かな",w:32,id:"kana"},{c:"Alt",w:38,id:"RAlt"},{c:"Win",w:32,id:"RWin"},
    {c:"Menu",w:32,id:"Menu"},{c:"Ctrl",w:40,id:"RCtrl" }
  ]
];
</script>
<script src="kb.js"></script>
</body>
</html>
