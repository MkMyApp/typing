<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード配列</title>
<style>
.contena {
  display: inline-block;
  border:solid 1px #ddd;
  padding:10px;
	transform-origin: top left;
  transform: scale(2);
}

.KB {
  padding:10px;
  border:none;
  display: block;
  vertical-align: top;
	transform-origin: top left;
  transform: scale(1);
}

/*
	block inline-block none
*/
#big   {display: none;}
#small {display: block;}
#kana  {display: none;}
#Dovrak{display: none;}

button {
	width:32px;
	height:32px;
	font-size:20px;
	margin-bottom:4px;
	margin-right:2px;
}

#editor {
	width:450px;
	height:32px;
	font-size:20px;
	margin-right:10px;

}

#CLR {
	width:32px;
	font-size:14px;
	font-family: monospace;
　font-weight: bold;
}

#BS {
	width:32px;
	font-size:14px;
	font-family: monospace;
　font-weight: bold;
}

#speak {
	width:32px;
	font-size:12px;
}

.Tab {width:48px;}
.LCtrl {width:48px;}
.Caps {width:64px;}
.Enter {width:56px;}
.Ent {width:40px;}
.LShift {width:80px;}
.RShift {width:64px;}
.Spc {width: 128px;}
.Win {width: 42px;}
.LAlt {width: 42px;}
.RAlt {width: 42px;}
.RCtrl {width: 48px;}

</style>
</head>
