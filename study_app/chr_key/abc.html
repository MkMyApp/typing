<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード配列</title>
<style>
.contena {
  display: inline-block;
  border:solid 1px #ddd;
  padding:10px;

	transform-origin: top left;
  transform: scale(2);
}

#big   {  display: none;}
#small {  display: block;}

.KB {
  display: inline-block;
  padding:10px;
  border:none;
  vertical-align: top;
	transform-origin: top left;
  transform: scale(1);
}

button {
	display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  box-sizing: border-box;
	width:32px;
	height:32px;
	font-size:14px;
	padding:0px;
	margin-bottom:0px;
	margin-bottom:8px;
	margin-right:2px;
	margin-left:2px;
}

#editor {
	width:295px;
	height:32px;
	font-size:20px;

}

#CLR {
	width:32px;
	font-size:12px;
	font-family: monospace;
 font-weight: bold;
}

#BS {
	width:32px;
	font-size:12px;
	font-family: monospace;
 font-weight: bold;
}

#speak {
	width:32px;
	font-size:12px;
	font-family: monospace;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="contena">
<input id="editor" type="text">
<button id="BS">BS</button>
<button id="speak">🔊</button>
<button id="CLR">AC</button>
<br>
<!-- 大文字 -->
<div class="KB" id="big">
<button>A</button>
<button>B</button>
<button>C</button>
<button>D</button>
<button>E</button>
<button>F</button>
<button>G</button>
<br>
<button>H</button>
<button>I</button>
<button>J</button>
<button>K</button>
<button>L</button>
<button>M</button>
<button>N</button>
<br>
<button>O</button>
<button>P</button>
<button>Q</button>
<button>R</button>
<button>S</button>
<button>T</button>
<button>U</button>
<br>
<button>V</button>
<button>W</button>
<button>X</button>
<button>Y</button>
<button>Z</button>
<br>
</div>
<!-- 小文字 -->
<div class="KB" id="small">
<button>a</button>
<button>b</button>
<button>c</button>
<button>d</button>
<button>e</button>
<button>f</button>
<button>g</button>
<br>
<button>h</button>
<button>i</button>
<button>j</button>
<button>k</button>
<button>l</button>
<button>m</button>
<button>n</button>
<br>
<button>o</button>
<button>p</button>
<button>q</button>
<button>r</button>
<button>s</button>
<button>t</button>
<button>u</button>
<br>
<button>v</button>
<button>w</button>
<button>x</button>
<button>y</button>
<button>z</button>
<br>
</div>
</div>
<script src="voice.js" defer></script>
</body>
</html>
