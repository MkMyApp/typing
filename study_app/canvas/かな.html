<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード Canvas描画</title>
<link rel="stylesheet" href="kb.css">
</head>
<body>
<!-- キーボード描画用 Canvas -->
<canvas id="keyboardCanvas"></canvas>

<!-- インプットフォーム -->
<div class="control-panel">
  <div class="btn-container-left">
    <div class="color-row">
	    <input type="color" class="hex" value="#ff0000"><input type="text" class="str" value="すはひえおかきこ">
	    <input type="color" class="hex" value="#0000ff"><input type="text" class="str" value="んくみやなまも">
			<br>
	    <input type="color" class="hex" value="#33aa55"><input type="text" class="str" value="あういしそゆよにのね">
	    <input type="color" class="hex" value="#ff6600"><input type="text" class="str" value="ふてとさらりるわほせ">
			<br>
	    <input type="color" class="hex" value="#ff2999"><input type="text" class="str" value="ぬたちつれめ゛けろへ゜むー">
	    <label class="func-label"><input type="checkbox" class="check">機能キー</label>
    </div>
  </div>
</div>

<script>
// --- 設定値 ---
const sVal = 2; // 拡大倍率
// キー配列と個別の幅 (w) 設定
const keyboardData = [
  [
    {c:"半/全",id:"IME"},
    {c:"ぬ"},{c:"ふ"},{c:"あ"},{c:"う"},{c:"え"},{c:"お"},
    {c:"や"},{c:"ゆ"},{c:"よ"},{c:"わ"},{c:"ほ"},{c:"へ"},{c:"ー"},
    {c:"BS",id:"BS" }
  ],
  [
    {c:"Tab",w:52,id:"Tab"},
    {c:"た"},{c:"て"},{c:"い"},{c:"す"},{c:"か"},{c:"ん"},
    {c:"な"},{c:"に"},{c:"ら"},{c:"せ"},{c:"゜"},{c:"゛"},
    {c:"Enter",w:50,id:"Enter" }
  ],
  [
    {c:"CapsLock",w:64,id:"Caps"},
    {c:"ち"},{c:"と"},{c:"し"},{c:"は"},{c:"き"},
    {c:"く"},{c:"ま"},{c:"の"},{c:"り"},{c:"れ"},{c:"け"},{c:"む"},
    {c:"⏎",w:38,id:"Ent" }
  ],
  [
    {c:"Shift",w:88,id:"LShift"},
    {c:"つ"},{c:"さ"},{c:"そ"},{c:"ひ"},{c:"こ"},
    {c:"み"},{c:"も"},{c:"ね"},{c:"る"},{c:"め"},{c:"ろ"},
    {c:"Shift",w:52,id:"RShift" }
  ],
  [
    {c:"Ctrl",w:52,id:"LCtrl"},{c:"Win",w:46,id:"LWin"},{c:"Alt",w:46,id:"LAlt"},
    {c:"無変換",w:32,id:"OFF"},{c:" ",w:122,id:"Spc"},{c:"変換",w:32,id:"ON"},
    {c:"かな",w:32,id:"kana"},{c:"Alt",w:38,id:"RAlt"},{c:"Win",w:32,id:"RWin"},
    {c:"Menu",w:32,id:"Menu"},{c:"Ctrl",w:40,id:"RCtrl" }
  ]
];
</script>

<div class="btn-container">
  <button class="save-btn" onclick="downloadKeyboardImage()">保存 (.png)</button>
</div>

<script src="kb.js"></script>

</body>
</html>
