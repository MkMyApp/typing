<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<title>ランダム文字列生成</title>
</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line" style="text-align:center"></div>
<textarea id="editor" class="line" spellcheck="false" rows="1"></textarea>
<script>
const TITLE_MSG = "テンプレート";//タイトル
const START_MSG = "Enter⏎";
const INPUT_MSG = "かな 確認";//英数 かな
const IME = "OFF";// ON Shift+Enter
const RANDOM = 10;// 出題数
const WIDTH = "20ch";// 入力幅 全角は2倍
</script>
<!---5----10---15---20---25---30---35---40--->
<textarea id="txtdata">
ちとしはまのりれ
</textarea>
<!---5----10---15---20---25---30---35---40--->
<textarea id="strdata" hidden>
たていすかんなにらせ
ちとしはきくまのりれ
つさそひこみもねるめ
</textarea>
<script>
const length = 6;// 問題文の長さ
const lines = 100; //生成問題数

function generateText() {
  let sourceText = "";
  const txtDataElem = document.getElementById('txtdata');
  const strDataElem = document.getElementById('strdata');

  // strdataが存在し、かつ値が入っていればそちらを優先、なければtxtdataを使う
  if (strDataElem && strDataElem.value.trim() !== "") {
    sourceText = strDataElem.value;
  } else if (txtDataElem) {
    sourceText = txtDataElem.value;
  }

  const chars = sourceText.replace(/[\n\r\s]/g, "");
  let result = "";
  
  if (chars.length > 0) {
    for (let i = 0; i < lines; i++) {
      let line = "";
      for (let j = 0; j < length; j++) {
        line += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      result += line + (i < lines - 1 ? "\n" : "");
    }
  }
  
  if (txtDataElem) {
    txtDataElem.value = result;
  }
}

document.addEventListener('DOMContentLoaded', () => {
	generateText();
	init();

  const strDataElem = document.getElementById('strdata');

  // F2キーで表示・非表示を切り替える
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') {
      e.preventDefault(); // ブラウザ標準のF2動作を抑制
      if (strDataElem) {
        if (strDataElem.hasAttribute('hidden')) {
          strDataElem.removeAttribute('hidden');
          strDataElem.focus(); // 表示されたらフォーカスを当てる
        } else {
          strDataElem.setAttribute('hidden', true);
	        generateText();
	        if (typeof init === 'function') {
	          init();
	        }

        }
      }
    }
  });
});
</script>
<script src="typing.js"></script>
<style>img {width:960px;margin-top:40px;}</style>
<br><img src="ひらがな最適化.png">
</body>
</html>
