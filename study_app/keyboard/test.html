<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キーボードひらがな変換ツール</title>
</head>
<body>
    <h1>キーボードひらがな変換ツール</h1>
    <p>英字は大文字で入力してください。</p>
    <textarea id="input" placeholder="1234567890-^\ASDFGHJKL;:]ZXCVBNM,./_"></textarea>
    <button id="convertBtn">変換する</button>
    
    <h3>変換結果:</h3>
    <div id="result" style="padding: 10px; border: 1px solid #ccc; background: #f9f9f9; min-height: 20px;"></div>

    <script>
        function cnv(input) {
            const map = {
                '1': 'ぬ', '2': 'ふ', '3': 'あ', '4': 'う', '5': 'え',
                '6': 'お', '7': 'や', '8': 'ゆ', '9': 'よ', '0': 'わ',
                '-': 'ほ', '^': 'へ', '\\': 'ー',
                'Q': 'た', 'W': 'て', 'E': 'い', 'R': 'す', 'T': 'か',
                'Y': 'ん', 'U': 'な', 'I': 'に', 'O': 'ら', 'P': 'せ',
                '@': '゛', '[': '゜',
                'A': 'ち', 'S': 'と', 'D': 'し', 'F': 'は', 'G': 'き',
                'H': 'く', 'J': 'ま', 'K': 'の', 'L': 'り', ';': 'れ',
                ':': 'け', ']': 'む',
                'Z': 'つ', 'X': 'さ', 'C': 'そ', 'V': 'ひ', 'B': 'こ',
                'N': 'み', 'M': 'も', ',': 'ね', '.': 'る', '/': 'め',
                '_': 'ろ'
            };

            return input.split('').map(char => map[char] || char).join('');
        }

        document.getElementById('convertBtn').addEventListener('click', function() {
            const input = document.getElementById('input').value;
            const output = cnv(input);
            document.getElementById('result').innerText = output;
        });
    </script>
</body>
</html>
