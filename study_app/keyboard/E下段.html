<body>
<!--   スクーリーンキーボード挿入   -->
<script>const sVal= 2;</script>
<script src="Lkey_2.js"></script>
<script>
setTransparent();//機能キーの文字を透過
applyTransparent();//文字色を透過

applyColor("Z","#F29", "#FFF");
applyColor("X","#F60", "#FFF");
applyColor("C","#3A5", "#FFF");
applyColor("V","#F00", "#FFF");
applyColor("B","#F00", "#FFF");
applyColor("N","#00F", "#FFF");
applyColor("M","#00F", "#FFF");
applyColor(",","#3A5", "#FFF");
applyColor(".","#F60", "#FFF");
applyColor("/","#F29", "#FFF");
//applyColor("-@:_","#F29", "#FFF");
//applyColor("^[]\\","#F29", "#FFF");
</script>
