    <iframe id="displayFrame" src="key.html" title="コンテンツ表示エリア"></iframe>

<script>
  function changePage(selID) {
      const select = document.getElementById(selID);
      const iframe = document.getElementById("displayFrame");
      const selectedValue = select.value;

      if (selectedValue) {
          iframe.src = selectedValue;
      }
  }
</script>
<hr>
機能キーの文字を透過<br>
setTransparent()<br>
すべての文字キーの文字色を透過<br>
applyTransparent()<br>
背景色　文字色　デフォルト<br>
applyColor("1")<br>
背景色　文字色 デフォルト<br>
applyColor("2","red")<br>
背景色　文字色透過<br>
applyColor("3","blue","")<br>
背景色 文字色<br>
applyColor("4","green", "#FFF")<br>
