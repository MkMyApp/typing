<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>キーボード運指図</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .container { 
      font-size: 24px;
      margin: 20px auto;
      padding: 20px;
      font-family: sans-serif;
    }

    select {
      width: 24ch;
      padding: 10px;
      font-size: 24px;
      margin: 0px 10px 30px 10px;
    }

    /* ボタン用スタイルの追加 */
    .copy-btn {
      padding: 10px 20px;
      font-size: 20px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
      vertical-align: top;
    }

    .copy-btn:hover {
      background-color: #0056b3;
    }

    iframe {
      width: 1250px;
      height: 480px;
      border: 1px solid #ccc;
      margin: 20px 0px 10px 50px;
    }

    .label-text {
      font-size: 24px;
      font-weight: bold;
      margin: 0 10px;
      display: inline-block;
      vertical-align: top;
    }
  </style>
</head>
<body>

<iframe id="displayFrame" src="abcColor.html" title="コンテンツ表示エリア"></iframe>

<div class="container">
    <label class="label-text">色設定 </label>
    <select id="cSelect" onchange="changePage('cSelect')">
      <option value="abcColor.html">英数</option>
      <option value="kanaColor.html">ひらがな</option>
    </select>
    
    <button class="copy-btn" onclick="copyIframeToClipboard()">クリップボードにコピー</button>
    <br>
</div>

<script>
  function changePage(selID) {
      const select = document.getElementById(selID);
      const iframe = document.getElementById("displayFrame");
      const selectedValue = select.value;

      if (selectedValue) {
          iframe.src = selectedValue;
      }
  }

  // 3. iframeのコンテンツを取得してクリップボードにコピーする関数
  async function copyIframeToClipboard() {
      const iframe = document.getElementById("displayFrame");
      
      try {
          // iframe内のdocumentオブジェクトを取得
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          
          // キーボードの要素（.KB）を取得（指定がなければbody全体）
          const targetElement = iframeDoc.querySelector('.KB') || iframeDoc.body;

          // html2canvasで描画を実行
          const canvas = await html2canvas(targetElement, {
              backgroundColor: '#ffffff', // 背景を白で固定する場合（必要に応じて変更可）
              scale: 2 // 画質向上のためのスケール設定
          });

          // CanvasをBlob（画像データ）に変換してクリップボードに書き込み
          canvas.toBlob(async (blob) => {
              if (!blob) {
                  alert('画像の生成に失敗しました。');
                  return;
              }
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              alert('クリップボードにキーボード画像をコピーしました！');
          }, 'image/png');

      } catch (err) {
          console.error('コピー処理中にエラーが発生しました:', err);
          alert('コピーに失敗しました。ブラウザの権限設定等をご確認ください。');
      }
  }
</script>
</body>
</html>
