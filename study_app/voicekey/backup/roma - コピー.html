<style>
.contena {
  display: inline-block;
  border:solid 1px #ddd;
  padding:10px;

	transform-origin: top left;
  transform: scale(2);
}

.KB {
  display: inline-block;
  padding:10px;
  border:none;
  vertical-align: top;
	transform-origin: top left;
  transform: scale(1);
}


/*

*/

button {
	display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  box-sizing: border-box;
	width:32px;
	height:32px;
	font-size:14px;
	padding:0px;
	margin-bottom:0px;
	margin-bottom:8px;
	margin-right:2px;
	margin-left:2px;
}

#editor {
	width:295px;
	height:32px;
	font-size:20px;

}

#CLR {
	width:32px;
	font-size:12px;
	font-family: monospace;
 font-weight: bold;
}

#BS {
	width:32px;
	font-size:12px;
	font-family: monospace;
 font-weight: bold;
}

#speak {
	width:32px;
	font-size:12px;
	font-family: monospace;
  font-weight: bold;
}
</style>
</head>

<script>
	document.querySelectorAll('.contena button').forEach(button => {
  // 1. ボタンのテキスト表記を小文字に置換
  /*
  button.textContent = button.textContent.toLowerCase();
  // (value属性が存在する場合はそちらも小文字に統一)
  if (button.value) {
    button.value = button.value.toLowerCase();
  }
  */
  // 2. 既存の文字数によるフォントサイズ調整処理
  const text = button.textContent.trim();
  if (text.length === 2) {
    button.style.fontSize = '12px';
  }
  if (text.length >= 3) {
    button.style.fontSize = '10px';
    button.style.marginBottom = '0px';
    button.style.marginTop = '0px';
  }
});
</script>
