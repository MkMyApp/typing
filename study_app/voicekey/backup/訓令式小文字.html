<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーボード配列</title>
<style>
.contena {
  display: inline-block;
  border:solid 1px #ddd;
  padding:10px;

	transform-origin: top left;
  transform: scale(2);
}
.KB {
  padding:10px;
  border:none;
  display: inline-block;
  vertical-align: top;
	transform-origin: top left;
  transform: scale(1);
}

button {
	width:32px;
	height:32px;
	font-size:14px;
	padding:0px;
	margin-bottom:8px;
	margin-right:2px;
}

#editor {
	width:350px;
	height:32px;
	font-size:20px;

}

#CLR {
	width:32px;
	font-size:14px;
	font-family: monospace;
 font-weight: bold;
}

#BS {
	width:32px;
	font-size:14px;
	font-family: monospace;
 font-weight: bold;
}

#speak {
	width:32px;
	font-size:12px;
}
</style>
</head>
<body>
<div class="contena">
<input id="editor" type="text"></input>
<button id="BS">BS</button>
<button id="speak">🔊</button>
<button id="CLR">AC</button>
<br>
<div class="KB">

<button>あ</button>
<button>い</button>
<button>う</button>
<button>え</button>
<button>お</button>

</html>
