<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>文字置換ツール</title>
<style>
	body{
	  font-family: sans-serif;
	  margin: 20px;
	}

	textarea { 
		font-family: monospace;
		font-size: 24px;
		margin-bottom: 20px;
		width:640px; height:240px;
	}

	button {
		font-size:20px;
		margin-bottom: 20px;
		width:80px;
		height:48px;
		margin-right:24px;
	}
	
</style>
</head>
<body>
  <h1>文字置換ツール</h1>
  <button onclick="toUpperText()">大文字</button>
  <button onclick="toLowerText()">小文字</button>
  <button onclick="repText()">分割</button>
  <button onclick="catText()">結合</button>
  <button onclick="tabText()">TAB</button>
  <br>
  <textarea id="txtdata" rows="3" cols="40"></textarea>
	<script>
	function toUpperText() {
	  const textArea = document.getElementById('txtdata');
	  textArea.value = textArea.value.toUpperCase();
	};

	function toLowerText() {
	  const textArea = document.getElementById('txtdata');
	  textArea.value = textArea.value.toLowerCase();
	};

function repText() {
const textArea = document.getElementById('txtdata');
  const text = textArea.value;

  const replacedText = text.replace(/[, 　]+/g, '\n');

  textArea.value = replacedText;
};

function tabText() {
  const textArea = document.getElementById('txtdata');
  const text = textArea.value;

  const replacedText = text.replace(/\t/g, '  ');

  textArea.value = replacedText;

};

function catText() {
  const textArea = document.getElementById('txtdata');
  const text = textArea.value;

  const replacedText = text.replace(/\n+/g, ' ');

  textArea.value = replacedText;
};
</script>
</body>
</html>
