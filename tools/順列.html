<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>順列生成</title>
<style>
body{
  font-family: sans-serif;
  margin: 20px;
}

#output {
    width: 100%;
    height: calc(100vh - 80px); 
    font-size: 24px;
    box-sizing: border-box;
}

#chars, #prefix, #suffix {
    vertical-align: bottom;
    box-sizing: border-box;
    font-size: 32px;
    line-height: 1.5;
    height: calc(1.5em);
    resize: horizontal;
    min-height: calc(1.5em);
    max-height: calc(1.5em);
    margin-right: 8px;
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.2;
}

#prefix, #suffix {
    width: 64px;
    min-width: 64px;
    max-width: 256px;
}

#chars {
    width: 128px;
    min-width: 128px;
}

	button {
	  font-size:24px;
	  width: 200px;
	  height: 48px;
	  margin-bottom: 12px;
	  margin-right:48px;
	}
</style>
</head>
<body>

<button onclick="runPermutation()">順列を生成</button>
<textarea id="prefix"></textarea>
<textarea id="chars"></textarea>
<textarea id="suffix"></textarea>
<br>
<textarea id="output"></textarea>

<script>
// 対象となる要素のIDリスト
const ids = ["chars", "prefix", "suffix"];

ids.forEach(id => {
  const el = document.getElementById(id);

  el.addEventListener("input", () => {
    // 1. 改行を除去
    el.value = el.value.replace(/\r?\n/g, "");

    // 2. 表示幅を計算（全角は2、半角は1としてカウント）
    let visualLength = 0;
    for (let i = 0; i < el.value.length; i++) {
      const code = el.value.charCodeAt(i);
      // JIS X 0208 などの範囲（おおよそ全角文字）を判定
      if ((code >= 0x0 && code < 0x81) || (code === 0xf8f0) || (code >= 0xff61 && code < 0xffa0) || (code >= 0xf8f1 && code < 0xf8f4)) {
        visualLength += 1; // 半角
      } else {
        visualLength += 2; // 全角
      }
    }

    // 3. 幅を計算
    const minWidth = (id === "chars" ? 128 : 64);
    
    // 文字のサイズ（32px）の半分（16px）を基準に計算
    const targetWidth = Math.max(visualLength * 16 + 48, minWidth);
    
    el.style.width = targetWidth + "px";
  });
  
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") e.preventDefault();
  });

  // 貼り付け等で改行が入るのを防ぐための処理
  el.addEventListener("input", (e) => {
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const originalValue = el.value;
    
    // 改行コードを空文字に置換
    const newValue = originalValue.replace(/\r?\n/g, "");
    
    if (originalValue !== newValue) {
      el.value = newValue;
      // カーソル位置を維持
      el.setSelectionRange(start, end);
    }
  });
});

function runPermutation() {
  // 1. 各textareaから値を取得する
  const prefixVal = document.getElementById("prefix").value;
  const charsRaw  = document.getElementById("chars").value;
  const suffixVal = document.getElementById("suffix").value;

  // 2. 「元配列」を作成する
  const charsArray = charsRaw.split(","); 

  // 入力が空の場合のチェック
  if (charsArray.length === 0) {
    alert("並び替える文字を入力してください");
    return;
  }

  const result = [];

  // 3. 取得した配列を使って順列を生成
  permutation(charsArray, result);

  // 4. 結果を組み立てて出力
  const text = result.map(row => {
    return prefixVal + row.join("") + suffixVal;
  }).join("\n");

  document.getElementById("output").value = text;
}

function permutation(aryIn, aryOut, i = 0) {
  let j;

  if (i < aryIn.length - 1) {

    for (j = i; j < aryIn.length; j++) {

      // 配列退避
      const ary = aryIn.slice();

      // 入れ替え
      const sTemp = aryIn[i];
      aryIn[i] = aryIn[j];
      aryIn[j] = sTemp;

      // 再帰
      permutation(aryIn, aryOut, i + 1);

      // 元に戻す
      aryIn = ary.slice();
    }

  } else {

    // 出力保存
    aryOut.push(aryIn.slice());

  }
}

</script>

</body>
</html>
