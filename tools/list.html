<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HTMLファイル一覧</title>
<style>
body {
  margin: 20px;

}

/* ツールバーの余白調整 */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0.5em 0; /* 左右の余白を0に */
  flex-wrap: wrap;
}

  .radio-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9em;
  }
  
  .separator {
    margin-left: 10px;
    border-left: 1px solid #ccc;
    padding-left: 10px;
    color: #666;
  }

textarea {
  display: block;
  box-sizing: border-box;

  width: 640px;
  height: 480px;
  min-width: 200px;
  min-height: 100px;
  /* --- サイズ・可変設定 --- */
  resize: both;           /* 縦・横の両方向を可変にする */
  overflow: auto;         /* 内容が溢れたらスクロールバーを表示 */

  /* --- 見た目の調整 --- */
  margin: 1em 0;
  padding: 10px;
  font-family: monospace;   /* コードやデータが見やすい等幅フォント */
  line-height: 1.5;         /* 行間を少し広げると読みやすくなります */
}

button {
	width: 120px;
	height: 48px;
	font-size:12pt;
}
</style>

</head>
<body>
  <div class="titlebar">
    <h1>HTML List</h1>
  </div>
<div class="toolbar">
  <button id="btnLoad">フォルダ選択</button>
  
  <div class="radio-group">
    <input type="radio" id="Link" name="answer" value="link" checked>
    <label for="Link">リンク</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="File" name="answer" value="file">
    <label for="File">ネーム</label>
  </div>

  <span class="separator">並び順：</span>
  <div class="radio-group">
    <input type="radio" id="SortName" name="sort" value="name">
    <label for="SortName">ファイル名順</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="SortDate" name="sort" value="date" checked>
    <label for="SortDate">タイムスタンプ順</label>
  </div>
</div>
<textarea id="output" placeholder="ここへフォルダをドラッグ＆ドロップ"></textarea>
<script>
// テキストエリアの高さを内容に合わせて自動調整する関数
function adjustHeight(el) {
  el.style.height = 'auto'; // 一度リセットして高さを再計算可能にする
  el.style.height = el.scrollHeight + 'px'; // 内容（スクロール領域）の高さに合わせる
}

async function buildHtmlListFromDirectoryHandle(dirHandle) {
  const files = [];
  const isLinkMode = document.getElementById("Link").checked;
  // 並び替え設定の取得
  const sortMode = document.querySelector('input[name="sort"]:checked').value;

  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === "file") {
      if (name.toLowerCase().endsWith(".html") && name.toLowerCase() !== "index.html") {
        const file = await handle.getFile();
        files.push({
          name: name,
          modified: file.lastModified
        });
      }
    }
  }

  // --- 並び替えの判定処理 ---
  if (sortMode === "name") {
    // ファイル名順（昇順 A→Z）
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
  } else {
    // タイムスタンプ順（新しい順）
    files.sort((a, b) => b.modified - a.modified);
  }
  // -------------------------

  let result = "";
  for (const file of files) {
    if (isLinkMode) {
      const title = file.name.replace(/\.html$/i, "");
      result += `<p><a href="${file.name}">${title}</a></p>\n`;
    } else {
      result += `'${file.name}',\n`;
    }
  }

  return { files, result };
}

async function listHtmlFiles() {
  const textarea = document.getElementById("output");
  textarea.value = "";

  try {
    const dirHandle = await window.showDirectoryPicker();
    const { files, result } = await buildHtmlListFromDirectoryHandle(dirHandle);

    textarea.value = result;
    adjustHeight(textarea); // 出力後に高さを調整
    alert("完了：" + files.length + "件");
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      alert("エラーが発生したか、対応していないブラウザです。");
    }
  }
}

document.getElementById("btnLoad").addEventListener("click", listHtmlFiles);

const output = document.getElementById("output");

output.addEventListener("dragover", (e) => {
  e.preventDefault();
  output.classList.add("drop-hover");
});

output.addEventListener("dragleave", () => {
  output.classList.remove("drop-hover");
});

output.addEventListener("drop", async (e) => {
  e.preventDefault();
  output.classList.remove("drop-hover");
  output.value = "";

  try {
    const item = e.dataTransfer.items[0];
    if (!item) {
      alert("何もドロップされていません。");
      return;
    }

    if (item.getAsFileSystemHandle) {
      const handle = await item.getAsFileSystemHandle();

      if (!handle || handle.kind !== "directory") {
        alert("フォルダをドロップしてください。");
        return;
      }

      const { files, result } = await buildHtmlListFromDirectoryHandle(handle);
      output.value = result;
      adjustHeight(output); // ドロップでの出力後も高さを調整
      alert("完了：" + files.length + "件");
      return;
    }

    alert("このブラウザではフォルダのドロップに対応していない可能性があります。");
  } catch (err) {
    console.error(err);
    alert("フォルダの読み取りに失敗しました。");
  }
});
// テキストエリアを直接編集した際にも高さを自動調整する
output.addEventListener("input", () => {
  adjustHeight(output);
});

</script>
</body>
</html>
