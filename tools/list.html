<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HTMLファイル一覧</title>
<style>
body {
  margin: 20px;

}

/* ツールバーの余白調整 */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0.5em 0; /* 左右の余白を0に */
  flex-wrap: wrap;
}

  .radio-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9em;
  }
  
  .separator {
    margin-left: 10px;
    border-left: 1px solid #ccc;
    padding-left: 10px;
    color: #666;
  }

textarea {
  display: block;
  box-sizing: border-box;

  width: 640px;
  height: 480px;
  min-width: 200px;
  min-height: 100px;
  /* --- サイズ・可変設定 --- */
  resize: both;           /* 縦・横の両方向を可変にする */
  overflow: auto;         /* 内容が溢れたらスクロールバーを表示 */

  /* --- 見た目の調整 --- */
  margin: 1em 0;
  padding: 10px;
  font-family: monospace;   /* コードやデータが見やすい等幅フォント */
  line-height: 1.5;         /* 行間を少し広げると読みやすくなります */
}

button {
	width: 120px;
	height: 48px;
	font-size:12pt;
}
</style>

</head>
<body>
  <div class="titlebar">
    <h1>HTML List</h1>
  </div>
<div class="toolbar">
  <button id="btnLoad">フォルダ選択</button>
  
  <div class="radio-group">
    <input type="radio" id="Link" name="answer" value="link" checked>
    <label for="Link">リンク</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="File" name="answer" value="file">
    <label for="File">ネーム</label>
  </div>

  <span class="separator">並び順：</span>
  <div class="radio-group">
    <input type="radio" id="SortName" name="sort" value="name">
    <label for="SortName">ファイル名順</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="SortDate" name="sort" value="date" checked>
    <label for="SortDate">タイムスタンプ順</label>
  </div>
</div>
<textarea id="output" placeholder="ここへフォルダをドラッグ＆ドロップ"></textarea>
<script src="list.js"></script>
</body>
</html>
