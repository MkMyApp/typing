<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>imgリスト</title>
<style>
  body { margin: 20px; display: flex; gap: 20px; font-family: sans-serif; }
  .sidebar { display: flex; flex-direction: column; width: 180px; gap: 10px; }
  h1 { margin: 0 0 10px 0; font-size: 1.5em; }
  select { flex: none; width: 320px; height: 480px; min-width: 320px; min-height: 480px; padding: 10px; font-family: monospace; font-size: 14px; overflow: auto; }
  button { width: 100%; height: 48px; font-size: 11pt; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
</style>
</head>
<body>

<div class="sidebar">
  <h1>imgList</h1>
  <button id="btnLoad">フォルダ選択</button>
  <button id="btnCopy" disabled>選択行をコピー</button>
</div>

<select id="output" size="20"></select>

<script>
let currentDirHandle = null;

// 抽出対象とする拡張子のリスト
const VALID_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.bmp'];

async function buildImageListFromDirectoryHandle(dirHandle) {
  const files = [];

  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === "file") {
      const lowerName = name.toLowerCase();
      if (VALID_EXTENSIONS.some(ext => lowerName.endsWith(ext))) {
        files.push(name);
      }
    }
  }

  // 自然順ソート（数値順の並び替え）
  files.sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
  return files;
}

function renderList(files) {
  const select = document.getElementById("output");
  const btnCopy = document.getElementById("btnCopy");
  select.innerHTML = "";
  btnCopy.disabled = true;

  if (files.length === 0) {
    const opt = document.createElement("option");
    opt.textContent = "（画像ファイルが見つかりませんでした）";
    opt.disabled = true;
    select.appendChild(opt);
    return;
  }

  files.forEach(fileName => {
    const opt = document.createElement("option");
    opt.value = fileName;
    opt.textContent = fileName;
    select.appendChild(opt);
  });
}

async function handleDirectorySelect(dirHandle) {
  currentDirHandle = dirHandle;
  const files = await buildImageListFromDirectoryHandle(dirHandle);
  renderList(files);
}

// フォルダ選択ボタン
document.getElementById("btnLoad").addEventListener("click", async () => {
  try {
    const dirHandle = await window.showDirectoryPicker();
    await handleDirectorySelect(dirHandle);
  } catch (err) {
    if (err.name !== 'AbortError') console.error(err);
  }
});

// リスト選択時にコピーボタンを有効化
const output = document.getElementById("output");
output.addEventListener("change", () => {
  const btnCopy = document.getElementById("btnCopy");
  btnCopy.disabled = !output.value;
});

// ドラッグ＆ドロップ対応
output.addEventListener("drop", async (e) => {
  e.preventDefault();
  const item = e.dataTransfer.items[0];
  if (item?.getAsFileSystemHandle) {
    const handle = await item.getAsFileSystemHandle();
    if (handle?.kind === "directory") {
      await handleDirectorySelect(handle);
    }
  }
});
output.addEventListener("dragover", (e) => e.preventDefault());

// 「選択行をコピー」ボタンの処理
document.getElementById("btnCopy").addEventListener("click", async () => {
  const selectedFile = output.value;
  if (!selectedFile) return;

  try {
    await navigator.clipboard.writeText(selectedFile);
  } catch (err) {
    console.error("コピーに失敗しました:", err);
  }
});
</script>
</body>
</html>
