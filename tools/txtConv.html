<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>編集ツール</title>
<style>
body {
  margin: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  font-family: sans-serif;
}
.container {
  margin-bottom: 0;
  border: 1px solid #ccc;
  padding: 15px;
  border-radius: 8px;
}

.error { color: red; font-weight: bold; }

input { font-family: monospace; font-size:300%; }

#txtdata { 
font-family: monospace;
margin-bottom: 20px;
font-size:24px;
}

button {
font-size:24px;
margin-bottom: 20px;
margin-right:20px;
width:92px;
height:48px;
}

#msg {
font-size:120%;
margin-left: 20px;
}
</style>
</head>
<body>
<div class="tools-wrapper" style="display: flex; flex-direction: column; gap: 10px;">
		<span style="font-size:200%;margin-left:12px;">編集ツール</span>

    <div class="container">
		  <button onclick="repText()">分割</button>
		  <button onclick="catText()">結合</button>
		  <br>
      <input type="radio" name="sepchr" value=" " checked>スペース
      <input type="radio" name="sepchr" value="," >カンマ
      <input type="radio" name="sepchr" value=":" >コロン
    </div>

    <div class="container">
        <p>変換元: <br>
        <input type="text" id="fromChars" style="width: 300px;"></p>
        <p>変換先: <br>
        <input type="text" id="toChars" style="width: 300px;"></p>
        <button onclick="convert()">変換</button><span id="msg"></span><br>
    </div>

    <div class="container">
	  <button onclick="toUpperText()">大文字</button>
	  <button onclick="toLowerText()">小文字</button><br>
	  <button onclick="dedupeLines()">重複</button>
	  <button onclick="formatText()">整形</button>
    </div>
	  <br>
</div>
<textarea id="txtdata" rows="27" cols="40"></textarea>

  <script>
      function convert() {
          const fromStr = document.getElementById('fromChars').value;
          const toStr = document.getElementById('toChars').value;
          const msg = document.getElementById('msg');

          // 文字数の一致判定
          if (fromStr.length !== toStr.length) {
              msg.innerHTML = `⚠️ エラー: 文字数が一致しません (変換元: ${fromStr.length}文字, 変換先: ${toStr.length}文字)`;
              return;
          }
          msg.innerHTML = "✅ 設定OK";

          // マッピング作成
          const map = {};
          for (let i = 0; i < fromStr.length; i++) {
              map[fromStr[i]] = toStr[i];
          }

          // 変換実行
          const input = document.getElementById('txtdata').value;
          const output = input.split('').map(char => map[char] || char).join('');
          document.getElementById('txtdata').value = output;
      }
      
function toUpperText() {
  const textArea = document.getElementById('txtdata');
  textArea.value = textArea.value.toUpperCase();
};

function toLowerText() {
  const textArea = document.getElementById('txtdata');
  textArea.value = textArea.value.toLowerCase();
};

function repText() {
    const textArea = document.getElementById('txtdata');
    const text = textArea.value;

    const selected = document.querySelector('input[name="sepchr"]:checked');
    if (!selected) return;
    const separator = selected.value;

    const regex = new RegExp(separator.replace(/([.*+?^${}()|[\]\\])/g, '\\$1'), 'g');
    
    const replacedText = text.replace(regex, '\n');

    textArea.value = replacedText;
}

function catText() {
    const textArea = document.getElementById('txtdata');
    const text = textArea.value;

    const selected = document.querySelector('input[name="sepchr"]:checked');
    if (!selected) return;
    const separator = selected.value;

    const lines = text.split(/\r?\n/);
    const replacedText = lines.map(line => line.trim()).join(separator);

    textArea.value = replacedText;
}

function dedupeLines() {
  const textarea = document.getElementById("txtdata");
  
  // 改行コードの統一と行分割
  const lines = textarea.value.replace(/\r\n/g, '\n').split('\n');
  const seen = new Set();
  const result = [];

  for (const line of lines) {
    // 空白行はそのまま追加、そうでなければ重複チェック
    if (line.trim() === '' || !seen.has(line)) {
      result.push(line);
      seen.add(line);
    }
  }

  textarea.value = result.join('\n');
}

function formatText() {
  const textarea = document.getElementById("text");
  
  // メソッドチェーンで一括置換
  textarea.value = textarea.value
    .replace(/\r\n/g, '\n')      // 改行コード統一
    .replace(/\t/g, '  ')        // タブをスペース2つに
    .replace(/　/g, '  ');        // 全角スペースを半角スペースに
}
</script>
</body>
</html>
