<!DOCTYPE html>
<html lang="ja">
<head>
<title id="title">Text</title>
<meta charset="UTF-8">
<style>
body{
  font-family: sans-serif;
  margin: 20px;
}

#status{
  font-family: monospace;
  font-size:20px;
  margin: 20px;
}

#status span{
  margin: 10px;
}

textarea {
  font-family: monospace; 
  font-size: 16px; 
  width: 1000px;
  height: 600px;
  min-width: 200px;
  min-height: 100px;
  line-height: 1.2;
  padding: 6px 8px;
  border: 1px solid #c0c0c0;
  box-sizing: border-box;
}

button{
  font-family: monospace;
  font-size: 20px;
  width:120px;
  padding: 16px;
  margin: 10px;
}

</style>

</head>

<body>
<h1>Text</h1> 
<p id="status">
  <span id="filename">File: (none)</span>
  <span id="modified"></span>
  <span id="linecount">Line: 1</span>
  <span id="charcount">Chars: 0</span>
  <span>　</span>
  <span id="maxLength">maxLen:</span>
</p>
<button onclick="clearText()">Clear</button>
<button onclick="loadFile()">Load</button>
<button onclick="editText()">Process</button>
<button onclick="countMax()">maxLen</button>
<button onclick="saveFile()">Save</button>
<button onclick="saveFileAs()">SaveAs</button>
<br>
<textarea id="text"></textarea>
<script src="text.js"></script>

</body>
</html>
