<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
<style>
body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: sans-serif;
  padding: 20px; 
  font-size: 24px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.title { 
  font-size: 48px; 
  font-weight: bold;
}

.title-bar {
  display: flex;
  align-items: center;
  gap: 15px;
}

/* コントロール全体の配置調整 */
.controls { 
  font-size: 24px; 
  line-height: 1.8;
  margin-top: 15px;
}

input { 
  font-size: 24px; 
  padding: 2px 6px;
  vertical-align: middle;
}

/* 3つのボタン（合成する、問題行数、最長＋5）のサイズ・スタイル統一 */
#COMP, #MAXLINE, #MAXLEN {
  font-family: sans-serif; /* 押しやすさ重視でゴシック体に統一 */
  font-size: 24px;
  width: 130px;
  height: 42px;
  padding: 0;
  margin: 0 0 0 8px;
  line-height: 36px; /* ボタン内の文字を縦中央に揃える */
  vertical-align: middle; /* 入力欄と高さを揃える */
  cursor: pointer;
  border: 1px solid #999;
  border-radius: 4px;
  background-color: #f0f0f0;
  box-sizing: border-box;
}

/* ボタンのホバー・アクティブ時のクリック感 */
#COMP:hover, #MAXLINE:hover, #MAXLEN:hover {
  background-color: #e0e0e0;
}

#COMP:active, #MAXLINE:active, #MAXLEN:active {
  background-color: #d0d0d0;
}

/* テキストエリア */
textarea {
  width: 640px;
  height:480px;
  flex-grow: 1;
  font-family: monospace; 
  font-size: 24px; 
  line-height: 1.3;
  padding: 8px;
  border: 1px solid #c0c0c0;
  box-sizing: border-box;
  margin-top: 24px;
  margin-bottom: 10px;
}
</style>

  <title>Const</title>
  <script src="Const.js" defer></script>
</head>
<body>
<div class="title-bar">
  <span class="title">Const</span>
  <button id="COMP" onclick="composeText()">合成する</button>
</div>

<div class="controls">
題　名：<input id="TITLE_INPUT" value="問題タイトル"><br>
開　始：<input id="START_INPUT" value="Enter⏎でスタート"><br>
文字種：<input id="INPUT_INPUT" value="英数 かな 確認"><br>
問題数：<input id="RANDOM_INPUT" value="0"><button id="MAXLINE">問題行数</button><br>
文字幅：<input id="WIDTH_INPUT" value="20ch"><button id="MAXLEN">最長＋５</button><br>
</div>

<textarea id="txtdata"></textarea>

</body>
</html>
