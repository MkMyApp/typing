<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォルダ一覧作成</title>
<style>
body {
  margin: 20px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0.5em 0;
  flex-wrap: wrap;
}

  .radio-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.9em;
  }
  
  .separator {
    margin-left: 10px;
    border-left: 1px solid #ccc;
    padding-left: 10px;
    color: #666;
  }

textarea {
  display: block;
  box-sizing: border-box;
  
  resize: both;
  overflow: auto;
  
  width: 640px;
  height: 480px;
  min-width: 200px;
  min-height: 100px;
  
  margin: 1em 0;
  padding: 10px;
  font-family: monospace;
  font-size:16px;
  line-height: 1.5;
}

button {
	width: 120px;
	height: 48px;
	font-size:10pt;
}
</style>
</head>
<body>
  <div class="titlebar">
    <h1>Sub-Folder List Generator</h1>
  </div>
<div class="toolbar">
  <button id="btnLoad">親フォルダを選択</button>
  
  <div class="radio-group">
    <input type="radio" id="Link" name="answer" value="link" checked>
    <label for="Link">リンク形式</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="File" name="answer" value="file">
    <label for="File">配列形式</label>
  </div>

  <span class="separator">並び順：</span>
  <div class="radio-group">
    <input type="radio" id="SortName" name="sort" value="name">
    <label for="SortName">フォルダ名順</label>
  </div>
  
  <div class="radio-group">
    <input type="radio" id="SortDate" name="sort" value="date" checked>
    <label for="SortDate">更新日時順</label>
  </div>
</div>
<textarea id="output" placeholder="ここへフォルダをドラッグ＆ドロップ"></textarea>
<script src="folder.js"></script>
</body>
</html>
