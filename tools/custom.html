<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
:root{
  --line-width:800px;
  --line-font-size:64px;
  --line-height:1.2;
  --line-padding-x:8px;
  --line-border:1px solid #c0c0c0;
}

body{
  font-family:sans-serif;
  text-align:center;
  margin:50px;
}

input {
  font-family: sans-serif;
  font-size: 24px;
  width: 300px;
  height: 34px;
  margin-bottom: 6px;
  vertical-align: middle;
}

#txtdata,#txtComp {
  display: block;
  width: calc(40ch + (var(--line-padding-x) * 2)); 
  min-width: calc(12ch + (var(--line-padding-x) * 2));
  height: 120px;
  min-height: 120px;
  margin-top: 0px;
  margin-left: 10px;
  margin-bottom: 0px;
  
  box-sizing: border-box;
  font-family: monospace;
  font-size: 24px;
  padding: 6px var(--line-padding-x);
  border: var(--line-border);
  background: #ffffff;
  text-align: left;
}

#custom {
  font-size: 24px;
  text-align: left;
  margin: 40px auto;
  width: fit-content;
}

#set {
  display: inline-block;
  text-align: left;
  margin-bottom: 20px;
}

#setTitle{
  font-size: 32px;
	margin:20px auto;
	display: flex;
  justify-content: center;
}

#btnBox{
  font-size: 32px;
	margin:20px auto;
	display: flex;
  justify-content: center;
}

#COMP {
  font-size: 24px;
  width: 320px;
  height: 64px;
  margin-right: 32px;
}

#ruler1,#ruler2 {
  width: max-content; 
  margin: 20px auto;
  font-family: monospace;
  font-size: 24px;
  letter-spacing: 0;
  color: #808080;
  padding-left: var(--line-padding-x); 
  text-align: left;
}

#MAXLEN,#MAXLINE {
font-family: monospace;
  font-size: 16px;
  width: 92px;
  height: 40px;
  vertical-align: top;
  margin-left: 4px;
  box-sizing: border-box;
}

</style>
<title>タイピング問題設定作成</title>
</head>
<body>
<div id="custom">
<div id="setTitle">
タイピング問題設定作成
</div>

<div id="set">
題　名：<input id="TITLE_MSG" value="問題タイトル"><br>
開　始：<input id="START_MSG" value="Enter⏎でスタート"><br>
文字種：<input id="INPUT_MSG" value="英数 かな"><br>
問題数：<input id="RANDOM" value="0"><button id="MAXLINE">問題行数</button><br>
文字幅：<input id="WIDTH" value="25ch"><button id="MAXLEN">最長＋５</button><br>
</div>

<div id="text">
<span id="ruler1" class="line">
+----5----10---15---20---25---30---35---40
</span>
<textarea id="txtdata">
ここに問題文を入力
複数の文字列を
改行で区切る。
</textarea>
<span id="ruler2" class="line">
+----5----10---15---20---25---30---35---40
</span>
</div>

<div id="btnBox">
	<button id="COMP" onclick="composeText()">設定</button>
</div>

<textarea id="txtComp" style="display: none;">
</textarea>
</div>
<script>
// 行数をカウントして問題数(input)に設定する関数
function countLines() {
  const txtdata = document.getElementById("txtdata").value;
  
  // 改行で分割して配列にする
  const lines = txtdata.split('\n');
  
  // 空白を除いた純粋な問題行だけを数える場合（おすすめ）
  const validLines = lines.filter(line => line.trim() !== "");
  
  // もし空行も含めて完全に改行の数で数えたい場合は、下の1行のコメントアウトを解除
  // const validLines = lines;

  // 問題数のinputに件数を反映
  document.getElementById("RANDOM").value = validLines.length;
}

// 画面が読み込まれたら「行数」ボタンにイベントリスナーを登録
document.addEventListener("DOMContentLoaded", () => {
  const maxLineButton = document.getElementById("MAXLINE");
  if (maxLineButton) {
    maxLineButton.addEventListener("click", countLines);
  }
});

// 文字列の半角換算での長さを返す関数（全角=2, 半角=1）
function getByteLength(str) {
  let length = 0;
  for (let i = 0; i < str.length; i++) {
    // シフトJIS換算などで全角になる文字コードの判定（簡易版）
    if (str.charCodeAt(i) >= 0x0020 && str.charCodeAt(i) <= 0x007e) {
      length += 1; // 半角
    } else {
      length += 2; // 全角
    }
  }
  return length;
}

// 最長行の文字数を判定して、(最長値 + 5) + "ch" をinputに代入する関数
function setMaxLength() {
  const txtdata = document.getElementById("txtdata").value;
  const lines = txtdata.split('\n');
  
  let maxLen = 0;
  
  // 各行の長さを半角換算で比較し、最大のものを探す
  lines.forEach(line => {
    const currentLen = getByteLength(line);
    if (currentLen > maxLen) {
      maxLen = currentLen;
    }
  });

  // 数値 + 5 に "ch" をつける
  const resultWidth = (maxLen + 5) + "ch";

  // 文字幅のinputに代入
  document.getElementById("WIDTH").value = resultWidth;
}

// 画面読み込み時に「最長」ボタンのイベントリスナーを登録
document.addEventListener("DOMContentLoaded", () => {
  const maxLenButton = document.getElementById("MAXLEN");
  if (maxLenButton) {
    maxLenButton.addEventListener("click", setMaxLength);
  }
});

function composeText() {

// 1. 各項目の値を取得
const titleMsg = document.getElementById('TITLE_MSG').value;
const startMsg = document.getElementById('START_MSG').value;
const inputMsg = document.getElementById('INPUT_MSG').value;
const randomVal = document.getElementById('RANDOM').value;
const widthVal = document.getElementById('WIDTH').value;

// 2. テキストエリアの要素を取得
const textArea = document.getElementById('txtdata');
const textComp = document.getElementById('txtComp');

// 3. 追加したい「const部分」を組み立てる
const configText = `<script>
const TITLE_MSG = "${titleMsg}";
const START_MSG = "${startMsg}";
const INPUT_MSG = "${inputMsg}";
const RANDOM = "${randomVal}";
const WIDTH = "${widthVal}";
<\/script>\n`;

const scaleText = `<!-------10--------20--------30--------40--------->\n`
const headText = `<textarea id="txtdata" hidden>\n`;

const footText = `</textarea>\n`;

const textVal = textArea.value;

// テキストエリアに合成結果を出力
textComp.value = configText + scaleText + headText + textVal + footText + scaleText;
textComp.style.display = "block";
}

</script>
</body>
</html>
