<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>大文字小文字変換ツール</title>
<style>
	textarea { 
	font-family: monospace;
	font-size: 24px;
	margin-bottom: 20px;
	width:640px; height:240px;
	}

	button {
	font-size:200%;
	margin-bottom: 20px;
	width:256px;
	height:48px;
	margin-right:24px;
	}
	
</style>
</head>
<body>
  <h1>文字置換ツール</h1>
  <button onclick="toUpperText()">大文字変換</button>
  <button onclick="toLowerText()">小文字変換</button><br>
  <textarea id="txtdata" rows="3" cols="40"></textarea>
	<script>
	function toUpperText() {
	  const textArea = document.getElementById('txtdata');
	  textArea.value = textArea.value.toUpperCase();
	}

	function toLowerText() {
	  const textArea = document.getElementById('txtdata');
	  textArea.value = textArea.value.toLowerCase();
	}
</script>
</body>
</html>
