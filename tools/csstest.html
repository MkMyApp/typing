<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style id="cssroot">
</style>
<style id="cssbody">
body {
  font-family: sans-serif;
  text-align: center;
  margin: 50px;
  background-color: var(--body-background-color);
  color: var(--body-color);

  /* 背景画像の設定 */
  background-image: var(--body-background-image);
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

#title {
  font-family: sans-serif;
  font-size: 2em;
  font-weight: bold;
  color: var(--title-color);
  margin-bottom: 6px;
}

#result {
  font-family: sans-serif;
  font-size: 2em;
  font-weight: bold;
  margin: 15px 0 30px;
  color: var(--score-color);
}

/* --- スコア欄の判定カラー --- */
#result[data-status="correct"] {
  color: var(--score-correct-color);
}

#result[data-status="wrong"] {
  color: var(--score-wrong-color);
}

.line {
  width: var(--line-width);
  margin: 10px auto;
  box-sizing: border-box;
  font-family: monospace;
  font-size: var(--line-font-size);
  line-height: var(--line-height);
}

#target {
  font-family: monospace;
  padding: 6px var(--line-padding-x);
  border: var(--line-border);
  background: var(--target-back-color);
  color: var(--char-default-color);
  text-align: left;
  white-space: pre;
  min-height: calc(1em * var(--line-height) + 20px);
  box-shadow: var(--line-shadow);
}

#editor {
  display: block;
  width: var(--line-width);
  margin: 10px auto;
  box-sizing: border-box;
  font-family: monospace;
  font-size: var(--line-font-size);
  line-height: var(--line-height);
  padding: 6px var(--line-padding-x);
  border: var(--line-border);
  background: var(--editor-back-color);
  color: var(--char-default-color);
  text-align: left;
  outline: none;
  overflow: hidden;
  height: calc(1em * var(--line-height) + 20px);
  min-height: calc(1em * var(--line-height) + 20px);
  box-shadow: var(--line-shadow);
  resize: none;
}

#exp, #dl {
  white-space: pre-wrap;
  text-align: left;
  width: 500px;
  padding: 20px;
  margin: 50px auto;
  border: var(--line-border);
  background-color: var(--body-background-color);
  color: var(--body-color);
  font-size: 1em;
  line-height: 1.5em;
  cursor: pointer;
}

/* --- JS切り替え・クラス指定用 --- */
.align-center {
  text-align: center !important;
}

.align-left {
  text-align: left !important;
}

.char-default {
  color: var(--char-default-color);
}

.char-correct {
  color: var(--char-correct-color);
}

.char-wrong {
  color: var(--char-wrong-color);
}
</style>
<style>
.setting-area {
  display: flex;
  justify-content: center; /* 中央寄せ */
  align-items: flex-start; /* 上端を揃える */
  gap: 10px;               /* テキストエリアとボタンエリアの間隔 */
  margin-top: 20px;
}

.button-group {
  display: flex;
  flex-direction: column;  /* ボタンを縦並びにする */
  gap: 10px;               /* ボタン同士の間隔 */
}

#textroot {
  font-size: 20px;
  width: 640px;
  height: 480px;
  margin: 0;               /* 外枠のmarginをリセット */
  box-sizing: border-box;  /* 高さ計算のブレを防止 */
}

button {
  font-size: 20px;
  width: 120px;
  height: 48px;
  margin: 0;               /* 外枠のmarginをリセット */
  box-sizing: border-box;  /* 高さ計算のブレを防止 */
}

</style>

<div class="setting-area">
<textarea id="textroot">
:root {
  /* 背景画像ありの定義 url("filename") */
  --body-background-image: none;

  /* --- カラー設定 --- */
  --body-background-color: #ffffff;
  --body-color: #000000;

  --title-color: #808080;

  --score-color: #808080;
  --score-correct-color: #8080f0;
  --score-wrong-color: #f08080;

  --char-default-color: #000000;
  --char-correct-color: #8080f0;
  --char-wrong-color: #f08080;

  --target-back-color: #f0f0f0;
  --editor-back-color: #f0f0ff;

  --border-color: #c0c0c0;
  --shadow-color: #d0d0d0;

  /* --- レイアウト設定 --- */
  --line-width: 800px;
  --line-font-size: 64px;
  --line-height: 1.2;
  --line-padding-x: 12px;
  --line-border: 2px solid var(--border-color);
  --line-shadow: 0 2px 5px var(--shadow-color);

}
</textarea>
	<div class="button-group">
    <button onClick="setColor()">配色</button>
    <button onClick="saveFile()">保存</button>
  </div>
</div>
<script>
// ダイアログを開いて保存する
async function saveFile() {
  const cssRoot = document.getElementById('cssroot').textContent;
  const cssBody = document.getElementById('cssbody').textContent;
  const text = `${cssRoot.trim()}\n\n${cssBody.trim()}`;

try {
    // 常にファイル保存ダイアログを開く
    const handle = await window.showSaveFilePicker({
      suggestedName: typeof currentFileName !== 'undefined' && currentFileName ? currentFileName : "style.css",
      types: [{
        description: "CSS Files",
        accept: { "text/css": [".css"] }
      }]
    });

    // 選択されたファイルハンドルを保存
    if (typeof fileHandle !== 'undefined') fileHandle = handle;
    if (typeof currentFileName !== 'undefined') currentFileName = handle.name;
    if (typeof updateFileName === 'function') updateFileName();

    // 書き込み処理
    const writable = await handle.createWritable();
    await writable.write(text);
    await writable.close();
    
  } catch (e) {
    // ユーザーがキャンセルした場合
    console.log("保存がキャンセルされました", e);
  }
}

function setColor() {
const styleEl = document.getElementById('cssroot');
const textEl = document.getElementById('textroot');

styleEl.textContent = textEl.value;
}

// 初期化時に適用
setColor();
</script>
