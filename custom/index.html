<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="custom.css">

<title>問題作成</title>
</head>
<body>
  <div id="title"></div>
  <div id="result"></div>
  <div id="target" class="line"></div>
  <textarea id="editor" class="line" spellcheck="false"></textarea>
  <script src="typing.js" defer></script>

<div id="custom">
	<div id="set">
		題　名：<input id="TITLE_MSG" value="問題作成"><br>
		開　始：<input id="START_MSG" value="Enter⏎でスタート"><br>
		文字種：<input id="INPUT_MSG" value="英数 かな"><br>
		問題数：<input id="RANDOM" value="0"><br>
		文字幅：<input id="WIDTH" value="25ch"><br>
	</div>

	<div id="text">
		<span class="ruler">+----5----10---15---20---25---30</span>
		<textarea id="txtdata"></textarea>
		<span class="ruler">+----5----10---15---20---25---30</span>
	</div>

	<div id="btnbox">
		<button class="btn" onclick="updateSettings()">設定</button>
  	<button class="btn" onclick="repText()">分割</button>
	  <button class="btn" onclick="catText()">結合</button>
	</div>

	<script>
			function repText() {
		    const textArea = document.getElementById('txtdata');
		    const text = textArea.value;

		    const separator = " ";

		    const regex = new RegExp(separator.replace(/([.*+?^${}()|[\]\\])/g, '\\$1'), 'g');
		    
		    const replacedText = text.replace(regex, '\n');

		    textArea.value = replacedText;
		}

		function catText() {
		    const textArea = document.getElementById('txtdata');
		    const text = textArea.value;

				const separator = " ";

		    const lines = text.split(/\r?\n/);
		    const replacedText = lines.map(line => line.trim()).join(separator);

		    textArea.value = replacedText;
		}
		
		function updateSettings() {
			TITLE_MSG = document.getElementById("TITLE_MSG").value;
			START_MSG = document.getElementById("START_MSG").value;
			INPUT_MSG = document.getElementById("INPUT_MSG").value;
			RANDOM    = Number(document.getElementById("RANDOM").value);
			WIDTH     = document.getElementById("WIDTH").value;
			init();
			document.getElementById("editor").focus();
		}

	updateSettings()

	</script>
</div>

</body>
</html>
