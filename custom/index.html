<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="custom.css">

<title>問題作成</title>
</head>
<body>
  <div id="title"></div>
  <div id="result"></div>
  <div id="target" class="line"></div>
  <textarea id="editor" class="line" spellcheck="false"></textarea>
  <script src="typing.js" defer></script>

<div id="custom">
	<div id="set">
		題　名：<input id="TITLE_MSG" value="問題作成"><br>
		開　始：<input id="START_MSG" value="Enter⏎でスタート"><br>
		文字種：<input id="INPUT_MSG" value="英数 かな"><br>
		問題数：<input id="RANDOM" value="0"><br>
		文字幅：<input id="WIDTH" value="25ch"><br>
	</div>

	<div id="text">
		<span class="ruler">+----5----10---15---20---25---30</span>
		<textarea id="txtdata"></textarea>
		<span class="ruler">+----5----10---15---20---25---30</span>
	</div>

	<div id="btnbox">
		<button class="btn" onclick="updateSettings()">設定</button>
  	<button class="btn" onclick="repText()">分割</button>
	  <button class="btn" onclick="catText()">結合</button>
	</div>

  <script src="custom.js" defer></script>

</div>
</body>
</html>
