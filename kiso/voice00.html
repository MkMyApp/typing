<!---5----10---15---20---25---30---35---40--->
<br><img src="voice00.png" style="width:480px;">
<script>
function setData() {
  const txtData = document.getElementById("txtdata");
  const currentDisplay = window.getComputedStyle(txtData).display;

  if (currentDisplay === "none") {
    txtData.style.display = "inline-block";
    txtData.focus();
  } else {
    txtData.style.display = "none";
    init();
  }
}
</script>
