<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <title>タイピング練習</title>
</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line" style="text-align:center"></div>
<textarea id="editor" class="line" spellcheck="false" rows="1"></textarea>
<script src="typing.js" defer></script>

<script>
const TITLE_MSG = "かな上段ランダム";
const START_MSG = "Enter⏎";
const INPUT_MSG = "かな";
const RANDOM = 10;
const WIDTH = "20ch";

const CHAR_LENGTH = 8;
const LINE_COUNT = 50;
const CHAR_RAW = `
たていすかんなにらせ
`;
const CHAR_SET = CHAR_RAW.replace(/[\n\r\s]/g, "");

window.addEventListener('DOMContentLoaded', () => {
	const txtData = document.getElementById('txtdata');
	txtData.value = generateRandomText(CHAR_SET, CHAR_LENGTH, LINE_COUNT);
	init();
});

function generateRandomText(chars, length, lines) {
  let result = "";
  for (let i = 0; i < lines; i++) {
    let line = "";
    for (let j = 0; j < length; j++) {
      line += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    result += line + (i < lines - 1 ? "\n" : "");
  }
  return result;
}
</script>
