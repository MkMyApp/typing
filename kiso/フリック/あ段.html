<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line" style="text-align:center"></div>
<textarea id="editor" class="line" spellcheck="false" rows="1"></textarea>

<!---5----10---15---20---25---30---35---40--->
<textarea id="txtdata" hidden>
</textarea>
<!---5----10---15---20---25---30---35---40--->

<script>
	const TITLE_MSG = "あ段の練習";
	const START_MSG = "Enter⏎";
	const INPUT_MSG = "かな";
	const RANDOM = 10;
	const WIDTH = "18ch";

  const chars = "あかさたなはまやらわ";
	const length = 8; //文字列長
	const lines = 50; //作成数

  let result = "";
  for (let i = 0; i < lines; i++) {
    let line = "";
    for (let j = 0; j < length; j++) {
      line += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    result += line + (i < lines - 1 ? "\n" : "");
  }

  const txtData = document.getElementById('txtdata');
  txtData.value = result;
</script>

<script src="typing.js"></script>
</body>
