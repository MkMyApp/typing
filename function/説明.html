<textarea id="editor" class="line" spellcheck="false" style="text-align:center;">回答入力欄</textarea>

<script>

</script>

<script>
  // Enterキーが押されるまで次に進まない仕組み（画面は暗転しません）
  const waitEnter = () => new Promise(resolve => {
    window.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter') {
        window.removeEventListener('keydown', handler);
        resolve();
      }
    });
  });

  (async () => {
    // ここでEnterキーを待つ（見た目は100%通常のまま停止）
    await waitEnter();

    // Enterが押されたら、ここで初めてtyping.jsを読み込んで開始する
    const script = document.createElement('script');
    script.src = 'typing.js';
    document.body.appendChild(script);
  })();
</script>
</body>
