<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
body {
	border: none;
	font-size: 24px;
	line-height: 1.2em;
	width:1024px;
	padding: 10px;
	margin: 20px auto 20px;
	white-space: pre-wrap;
}

h1 {
	display: inline-block;
	font-size:140%;
}

h2 {
	display: inline-block;
	font-size:120%;
}

a {
	color:#000000;
	text-decoration: none;
}

a:hover {
	color: blue;
}

	#frm_type {
  width: 100%;
  height: 480px;
  border: none;
  white-space: normal;
  margin: 0 auto;
  padding: 0px;
}

#reload {
  display: block;     /* 中央寄せに必要 */
  margin: 20px auto;  /* 上下に20pxの余白、左右は自動（中央） */
  width: 200px;       /* ボタンの横幅 */
  height: 50px;       /* ボタンの高さ */
  font-size: 2rem;  /* 文字を少し大きく */
  cursor: pointer;    /* ホバー時に指マークにする */
}
</style>
<title>ランダムセレクト</title>
</head>
<body>
<iframe id="frm_type"></iframe>
<button id="reload">リロード</button>
<script>
const menuList = [
'ABC小文字',
'ABC大文字',
'あいう',
'いろは',
'ひらがな',
'初級英単語60',
]

const iframeElement = document.getElementById('frm_type');
const reloadBtn = document.getElementById('reload');

// 直前のインデックスを保持する変数
let lastIndex = -1;

// ランダムにページを読み込む関数
function loadRandomPage() {
    if (menuList.length <= 1) {
        iframeElement.src = menuList[0] + ".html";
        return;
    }

    let newIndex;
    
    // 直前と同じ index が選ばれている間、ランダム抽選を繰り返す
    do {
        newIndex = Math.floor(Math.random() * menuList.length);
    } while (newIndex === lastIndex);

    // 今回の index を保存
    lastIndex = newIndex;
    iframeElement.src = menuList[newIndex] + ".html";
}

// リロードボタンの制御
if (window.self !== window.top) {
    // iframeの中にいる場合：ボタンを隠す
    reloadBtn.style.display = 'none';
} else {
    // iframeの外にいる場合：ボタンを表示したまま、イベントを登録する
    reloadBtn.style.display = 'block'; 
    reloadBtn.addEventListener('click', () => {
        loadRandomPage();
    });
}

// 初回読み込み
	loadRandomPage();

</script>
</body>
</html>
