<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" id="theme-style" href="style.css">
	<title>スキン変更テスト</title>
</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line"></div>
<textarea id="editor" class="line" spellcheck="false"></textarea>

<script>
  const TITLE_MSG = "問題タイトル";
  const START_MSG = "Enter⏎でスタート";
  const INPUT_MSG = "英数 かな 確認";
  const RANDOM = 0; // 出題数
  const WIDTH = "25ch";
  const IME = 'ON'; // 'OFF'
</script>
<!---5----10---15---20---25---30---35---40--->
<textarea id="txtdata" hidden>
ABCDEFG
あいうえお
亜伊雨絵尾
</textarea>
<!---5----10---15---20---25---30---35---40--->

<script src="typing.js"></script>

<div id="theme-selector-container" style="font-size:20px;">
	<label for="theme-select">テーマ切り替え: </label>
	<select id="theme-select" style="font-size:20px;width:200px;"></select>
</div>
<script>
  // 1. CSSファイルのリストを配列で定義
  const cssList = [
'type.css',
'light.css',
'dark.css',
'mint.css',
'ファンシー.css',
'ハロウィン.css',
'黒板.css',
'ハッカー.css',
'サイバーウォー.css',
'サイバー.css',
'電脳空間.css',
'デジタル.css',
'侍.css',
'道場.css',
  ];

  // 2. DOM要素の取得
  const themeSelect = document.getElementById('theme-select');
  const themeStyle = document.getElementById('theme-style');

  // 3. 配列から<option>タグを動的に生成して<select>に追加
  cssList.forEach(cssFile => {
    const option = document.createElement('option');
    option.value = cssFile;
    // 表示名をファイル名から拡張子を除いたものにする場合
    option.textContent = cssFile.replace('.css', '');
    themeSelect.appendChild(option);
  });

  // 4. セレクトボックスの値が変更されたときに <link> の href を書き換える
  themeSelect.addEventListener('change', (event) => {
    themeStyle.href = event.target.value;
  });
</script>
</body>
</html>
