<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="edit.css">
<title>タイピング練習を作る</title>
<script src="edit.js"></script>
</head>
<body>
<div class="header">タイピング練習を作る</div>
<div class="container">
	<div class="item">
		<div class="form-group">
			ローカルストレイジ<br>
			<button class="custom-btn" onclick="onlyURL()">URL</button>
			<input id="url" class="custom-input" value="index.html">
			<div id="btn-group0">
				<button class="action-btn" onclick="saveToLocalStorage();onlyURL()">OPEN</button>
				<button class="action-btn" onclick="openClear()">DEL</button>
				<button class="action-btn" onclick="loadFromLocalStorage()">LOAD</button>
			</div>
		</div>
		<div class="form-group">
			クエリ<br>
			<button class="custom-btn" onclick="openURL()">OPEN</button>
			<textarea id="query" class="custom-input custom-textarea"></textarea>
			<br>
			<div id="btn-group">
				<button class="action-btn" onclick="joinQuery('?')">?JOIN</button>
				<button class="action-btn" onclick="joinQuery('#')">#JOIN</button>
				<br>
				<button class="action-btn" onclick="clearQuery()">CLEAR</button>
				<button class="action-btn" onclick="copyText()">COPY</button>
				<br>
				<button class="action-btn" onclick="decodeQuery()">DECODE</button>
				<button class="action-btn" onclick="parseQuery()">PARSE</button>
				<br>
				<button class="action-btn" onclick="loadQuery()">LOAD</button>
				<button class="action-btn" onclick="saveQuery()">SAVE</button>
			</div>
		</div>
	</div>

	<div class="item">
		<div class="setval-group">
			タイトル<br>
			<button class="custom-btn">t</button>
			<input id="title" class="custom-input" value="問題タイトル">
		</div>

		<div class="setval-group">
			問題表示幅<br>
			<button class="custom-btn" onclick="setMaxLength()">w</button>
			<input id="WIDTH" class="custom-input" value="20ch">
		</div>

		<div class="setval-group">
			問題文字列<br>
			<button class="custom-btn" onclick="saveToLocalStorage();window.open('../../custom/custom.html', '_blank')">txt</button>
			<textarea id="txtdata" class="custom-input custom-textarea"></textarea>
		</div>

	</div>

	<div class="item">
		<div class="setval-group">
			スタートメッセージ<br>
			<button class="custom-btn">s</button>
			<input class="custom-input" value="Enter⏎">
		</div>

		<div class="setval-group">
			確認メッセージ<br>
			<button class="custom-btn">m</button>
			<input class="custom-input" value="英数 かな">
		</div>

		<div class="setval-group">
			off:Enter on:Shift+Enter<br>
			<button class="custom-btn">ime</button>
			<input class="custom-input" value="on">
		</div>

		<div class="setval-group">
			出題数 0:順番<br>
			<button class="custom-btn" onclick="countLines()">rnd</button>
			<input id="RANDOM" class="custom-input" value="0">
		</div>
	</div>
</div>
</body>
</html>
