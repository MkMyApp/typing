春はあけぼの。
ようよう白くなりゆく山ぎわ、少しあかりて、紫だちたる雲の細くたなびきたる。

夏はよる。
月のころはさらなり、闇もなお、ほたるの多く飛びちがいたる。
また、ただ一つ二つなど、ほのかにうちひかりて行くも、おかし。
雨など降るも、おかし。

秋は夕ぐれ。
夕日のさして山のはいと近くなりたるに、からすの寝どころへ行くとて、三つ四つ、二つ三つなど飛び急ぐさえ、あはれなり。
まいて、かりなどの連ねたるが、いと小さく見ゆるは、いとをかし。
日入りはてて、風の音、虫のねなど、はたいとあはれなり。

冬はつとめて。
雪の降りたるは、いうべきにもあらず、霜のいと白きも、またさらでもいと寒きに、火など急ぎおこして、炭持ってわたるも、いとつきづきし。
昼になりて、ぬるくゆるみもていけば、火桶の火も、白い灰がちになりて、わろし。
