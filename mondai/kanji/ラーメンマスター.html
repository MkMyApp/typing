<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
	<title>ラーメンマスター</title>
</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line"></div>
<textarea id="editor" class="line" spellcheck="false"></textarea>

<script>
  const TITLE_MSG = "ラーメンマスター";
  const START_MSG = "Enter⏎でスタート";
  const INPUT_MSG = "かな 確認";
  const IME = 'ON';
  const RANDOM = 10;
  // const WIDTH = "50ch";
</script>

<textarea id="txtdata" hidden>
</textarea>
<script>
  function makeWord() {
    // ベースとなる麺・メニューの種類
    const bases = [
      "ラーメン",
      "小ラーメン",
      "大ラーメン",
      "豚ダブルラーメン",
      "豚入りラーメン",
      "汁なし",
      "つけ麺",
      "ミニラーメン",
      "少なめラーメン",
      "半分ラーメン"
    ];

    // 麺の固さ・調整
    const noodleStyles = [
      "メンカタメ",
      "メンヤワメ",
      "バリカタ",
      "アブラスクナメ",
      "ウスメ",
      "デフォ"
    ];

    // コール要素1：ヤサイ・ニンニク等
    const toppings = [
      "ヤサイ",
      "ニンニク",
      "アブラ",
      "カラメ",
      "ネギ",
      "タマゴ",
      "タマネギ",
      "ベニショウガ"
    ];

    // コール要素2：コール強度・状態
    const modifiers = [
      "マシ",
      "マシマシ",
      "スクナメ",
      "カタマリ",
      "ナシ",
      "チョイマシ"
    ];

    const base = bases[Math.floor(Math.random() * bases.length)];
    const noodleStyle = noodleStyles[Math.floor(Math.random() * noodleStyles.length)];
    const topping1 = toppings[Math.floor(Math.random() * toppings.length)];
    const modifier1 = modifiers[Math.floor(Math.random() * modifiers.length)];
    const topping2 = toppings[Math.floor(Math.random() * toppings.length)];
    const modifier2 = modifiers[Math.floor(Math.random() * modifiers.length)];

    // 生成パターンのバリエーション（コール組み合わせ）
    const pattern = Math.floor(Math.random() * 3);

    if (pattern === 0) {
      // 例: 小ラーメンメンカタメヤサイマシニンニクマシマシ
      return `${base}${noodleStyle}${topping1}${modifier1}${topping2}${modifier2}`;
    } else if (pattern === 1) {
      // 例: 豚入りラーメンニンニクマシマシアブラカタマリ
      return `${base}${topping1}${modifier1}${topping2}${modifier2}`;
    } else {
      // 例: 汁なしメンカタメアブラマシ
      return `${base}${noodleStyle}${topping1}${modifier1}`;
    }
  }

function getDisplayLength(str) {
  let length = 0;
  for (const char of str) {
    // 全角文字（ASCII外）は 2、半角文字は 1 と扱う
    if (char.match(/[^\x01-\x7E]/)) {
      length += 2;
    } else {
      length += 1;
    }
  }
  return length;
}

function makeWords() {
  let words = '';
  let maxDisplayLength = 0;

  for (let i = 0; i < 100; i++) {
    const word = makeWord();
    const displayLength = getDisplayLength(word);

    if (displayLength > maxDisplayLength) {
      maxDisplayLength = displayLength;
    }
    words = words + word + '\n';
  }

  // 表示上の最長幅（半角換算）に +10 して ch 単位で指定
  window.WIDTH = `${maxDisplayLength + 10}ch`;

  return words;
}

  document.getElementById('txtdata').value = makeWords();
</script>
<script src="typing.js"></script>
</body>
</html>
