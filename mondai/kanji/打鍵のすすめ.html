<textarea id="txtdata" hidden>
紙に筆で書きたるも
鍵盤を打鍵するも、
綴りたる文書に変わりなし。
されど、速く美しく文書が
良きことは言うまでもなし。
周囲を見渡すに、
速き人、遅き人あり、
蚯蚓の這いたる如きあり、
読みやすき文、
読みにくき文ありて
その有様
雲と泥との相違あるに
似たるはなんぞや。
その次第甚だ明らかなり。
鍵盤を上手に操るは、
打鍵の修行を
積むと積まざるに
よるものなり。
</textarea>
