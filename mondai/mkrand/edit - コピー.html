		box-sizing: border-box;
		width: 240px; /* 入力欄の横幅 */

		color: #333;
		background-color: #fff;
		border: 1px solid #ccc;
		border-left: none; /* ボタンと隣り合う境界線を重ねる */
		border-radius: 0 4px 4px 0; /* 右側の角丸 */

	.custom-input:focus {

		box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);

		font-weight: bold;
		color: #fff;
		background-color: #4a90e2;
		border: 1px solid #357abd;
		border-radius: 4px 0 0 4px; /* 左側の角丸 */

		box-sizing: border-box;
		width: 100%;

		padding: 10px 12px;

		color: #333;

		border: 1px solid #ccc;
		border-radius: 4px;

<body>
<h1 id="edit">呪文生成</h1>
<script>
function mkQuery() {
	const groups = document.querySelectorAll('.form-group');
	let baseUrl = 'mkrand.html'; // デフォルトのベースURL
	const params = [];

	groups.forEach(group => {
		const btn = group.querySelector('.custom-btn');
		const input = group.querySelector('.custom-input');
		if (!btn || !input) return;

		const key = btn.textContent.trim();
		const val = input.value.trim();

		if (key === 'URL') {
			// URL欄の値があればベースURLとして採用
			if (val !== '') {
				baseUrl = val;
			}
		} else {
			// 値が入力されているものだけパラメータとして追加
			if (val !== '') {
				params.push(encodeURIComponent(key) + '=' + encodeURIComponent(val));
			}
		}
	});

	// パラメータがある場合は「?」を挟んで結合
	let finalUrl = baseUrl;
	if (params.length > 0) {
		finalUrl += '?' + params.join('&');
	}

	// <input id="query"> に代入
	document.getElementById('query').value = finalUrl;
}

function devQuery() {
	const queryStr = document.getElementById('query').value.trim();
	if (!queryStr) return;

	// 「?」を境にベースURLとクエリパラメータ文字列に分割
	const qIndex = queryStr.indexOf('?');
	let baseUrl = '';
	let paramStr = '';

	if (qIndex !== -1) {
		baseUrl = queryStr.slice(0, qIndex);
		paramStr = queryStr.slice(qIndex + 1);
	} else {
		baseUrl = queryStr;
	}

	// パラメータをキーと値のマップに格納（URLデコードも行う）
	const paramMap = {};
	if (paramStr) {
		paramStr.split('&').forEach(pair => {
			if (!pair) return;
			const eqIndex = pair.indexOf('=');
			if (eqIndex !== -1) {
				const key = decodeURIComponent(pair.slice(0, eqIndex));
				const val = decodeURIComponent(pair.slice(eqIndex + 1));
				paramMap[key] = val;
			} else {
				const key = decodeURIComponent(pair);
				paramMap[key] = '';
			}
		});
	}

	// 各フォームの入力欄へ値を分配
	const groups = document.querySelectorAll('.form-group');
	groups.forEach(group => {
		const btn = group.querySelector('.custom-btn');
		const input = group.querySelector('.custom-input');
		if (!btn || !input) return;

		const key = btn.textContent.trim();

		if (key === 'URL') {
			input.value = baseUrl;
		} else if (key in paramMap) {
			input.value = paramMap[key];
		} else {
			// URLに含まれていないパラメータ欄は空にする
			input.value = '';
		}
	});
}

function clrQuery() {
	document.getElementById('query').value = "";
}

function openURL() {
	const finalUrl = document.getElementById('query').value;
	if (finalUrl) {
		window.open(finalUrl, '_blank');
	}
}

// .txt ファイルを読み込んで query にセットする関数
function loadQuery() {
	const fileInput = document.createElement('input');
	fileInput.type = 'file';
	fileInput.accept = '.txt';

	fileInput.onchange = (e) => {
		const file = e.target.files[0];
		if (!file) return;

		const reader = new FileReader();
		reader.onload = (event) => {
			const queryInput = document.getElementById('query');
			if (queryInput) {
				queryInput.value = event.target.result;
			}
		};
		reader.readAsText(file);
	};

	fileInput.click();
}

// query の内容を ファイル選択ダイアログを表示して保存する関数
async function saveQuery() {
	const queryInput = document.getElementById('query');
	if (!queryInput) return;

	// id="title" から値を取得（空の場合は 'query' をデフォルトにする）
	const titleInput = document.getElementById('title');
	let defaultName = (titleInput && titleInput.value.trim()) ? titleInput.value.trim() : 'query';

	// 末尾に .txt が付いていなければ追加
	if (!defaultName.endsWith('.txt')) {
		defaultName += '.txt';
	}

	const content = queryInput.value;

	// FileSystem Access API (showSaveFilePicker) が使える場合
	if ('showSaveFilePicker' in window) {
		try {
			const handle = await window.showSaveFilePicker({
				suggestedName: defaultName,
				types: [{
					description: 'Text Files',
					accept: {
						'text/plain': ['.txt'],
					},
				}],
			});
			const writable = await handle.createWritable();
			await writable.write(content);
			await writable.close();
		} catch (err) {
			if (err.name !== 'AbortError') {
				console.error('保存処理中にエラーが発生しました:', err);
			}
		}
	} else {
		// 未対応環境用のフォールバック（プロンプト表示）
		let fileName = prompt('保存するファイル名を入力してください:', defaultName);
		if (fileName === null) return;

		fileName = fileName.trim() || 'query';
		if (!fileName.endsWith('.txt')) {
			fileName += '.txt';
		}

		const blob = new Blob([content], { type: 'text/plain' });
		const url = URL.createObjectURL(blob);

		const a = document.createElement('a');
		a.href = url;
		a.download = fileName;
		document.body.appendChild(a);
		a.click();

		document.body.removeChild(a);
		URL.revokeObjectURL(url);
	}
}

  try {
