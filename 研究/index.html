<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
	<title>タイピングの測定</title>
</head>
<body>
<div id="title"></div>
<div id="result"></div>
<div id="target" class="line" style="text-align:center"></div>
<textarea id="editor" class="line" spellcheck="false" rows="1"></textarea>

<link rel="stylesheet" href="setData.css">
<div id="setBox">
	<div id="set">
	  <div hidden>
		題　名：<input id="TITLE_MSG" value="研究打"><br>
		開　始：<input id="START_MSG" value="Enter⏎"><br>
		文字種：<input id="INPUT_MSG" value="確認"><br>
    </div>
		シフト：<input id="IME" value="ON"><br>
		問題数：<input id="RANDOM" value="0"><br>
		文字幅：<input id="WIDTH" value="25ch"><button class="sBtn" onclick="setMaxLength()">最長幅</button><br>
	</div>
  <div class="btn-container">
    <button class="Btn" onclick="clrText()">消去</button>
    <button class="Btn" onclick="repText()">分割</button>
    <button class="Btn" onclick="catText()">結合</button>
	</div>
  <div class="btn-container">
    <button class="Btn" onclick="loadFile()">読込</button>
    <button class="Btn" onclick="saveFile()">保存</button>
    <button class="Btn" onclick="setFont()">フォント</button>
    <button class="Btn" onclick="updateStrData()">設定</button>
  </div>
<textarea id="txtdata" placeholder="問題文を入力">
</textarea>
</div>
<script src="setData.js"></script>
<script src="typing.js"></script>
<script src="recode.js"></script>
</body>
</html>
