<!-- 問題生成 -->
<script>
// 【設定】生成したい文字、桁数、行数
const CHOSEN_CHARS = "0123456789"; // テンキー用に数字を指定
const DIGITS = 4;                 // 1行あたりの桁数（例: 4桁）
const TOTAL_LINES = 100;           // 生成する問題の行数
const IME = 'OFF';
// 任意の条件で文字列を生成する汎用関数
function makeRandomProblems(chars, length, lines) {
  let result = "";
  for (let i = 0; i < lines; i++) {
    let line = "";
    for (let j = 0; j < length; j++) {
      line += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    result += line + (i < lines - 1 ? "\n" : "");
  }
  return result;
}

// 文字列を生成して txtdata に流し込む
const strDat = makeRandomProblems(CHOSEN_CHARS, DIGITS, TOTAL_LINES);
document.getElementById('txtdata').value = strDat;
</script>
