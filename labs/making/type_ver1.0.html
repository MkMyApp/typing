<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング練習</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
      color: #333333;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 表示エリアと入力エリアの共通スタイル */
    .display-area {
      width: 100%;
      font-family: inherit;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 0.05em;
      line-height: 1.5;
      padding: 15px 20px;
      box-sizing: border-box;
      border: 2px solid #e1e4e8;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: left;
      word-break: break-all;
    }

    /* 問題表示エリア固有のスタイル */
    div.display-area {
      background-color: #f4f6f8;
      min-height: 72px;
    }

    /* 入力エリア固有のスタイル */
    input.display-area {
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input.display-area:focus {
      border-color: #0066cc;
      background-color: #fafafa;
    }

    /* 一文字ごとの判定カラー定義 */
    .char-correct {
      color: #28a745; /* 正解：緑 */
    }

    .char-incorrect {
      color: #dc3545; /* 不正解：赤 */
      background-color: #ffe6e6; /* 背景を薄い赤にして視認性を向上 */
    }

    /* 結果メッセージのスタイル */
    .result {
      font-size: 24px;
      font-weight: bold;
      min-height: 28px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>タイピング練習</h1>

  <textarea id="sentenceInput" hidden>
		あいうえお
		かきくけこ
		さしすせそ
		たちつてと
		なにぬねの
		はひふへほ
		まみむめも
		やゆよ
		らりるれろ
		わをん
  </textarea>

  <!-- 表示エリア -->
  <div class="display-area" id="targetDisplay"></div>

  <!-- 入力エリア -->
  <input type="text" class="display-area" id="userInput" disabled>

  <div class="result" id="resultMessage"></div>

  <script>
    var sentences = [];
    var currentIndex = 0;

    var textarea = document.getElementById('sentenceInput');
    var targetDisplay = document.getElementById('targetDisplay');
    var userInput = document.getElementById('userInput');
    var resultMessage = document.getElementById('resultMessage');

    function loadSentence() {
      var text = textarea ? textarea.value : '';

      sentences = text
        .split(/\r?\n/)
        .map(function(line) {
          return line.trim();
        })
        .filter(function(line) {
          return line.length > 0;
        });

      currentIndex = 0;
      displaySentence();
    }

    function displaySentence() {
      if (sentences.length === 0) {
        targetDisplay.textContent = 'データがありません。';
        userInput.disabled = true;
        return;
      }

      // 問題文を1文字ずつ文字単位のspanで囲んで描画
      var currentTarget = sentences[currentIndex];
      targetDisplay.innerHTML = '';
      
      for (var i = 0; i < currentTarget.length; i++) {
        var span = document.createElement('span');
        span.textContent = currentTarget[i];
        targetDisplay.appendChild(span);
      }

      userInput.disabled = false;
      userInput.value = '';
      userInput.focus();
    }

    // 入力中の各文字の判定と色付け処理
    function renderCharColors() {
      if (sentences.length === 0) {
        return;
      }

      var currentTarget = sentences[currentIndex];
      var inputValue = userInput.value;
      var spans = targetDisplay.querySelectorAll('span');

      for (var i = 0; i < spans.length; i++) {
        if (i < inputValue.length) {
          if (inputValue[i] === currentTarget[i]) {
            spans[i].className = 'char-correct';
          } else {
            spans[i].className = 'char-incorrect';
          }
        } else {
          spans[i].className = '';
        }
      }
    }

    function checkAnswer() {
      if (sentences.length === 0) {
        return;
      }

      var currentTarget = sentences[currentIndex];
      var inputValue = userInput.value.trim();

      if (inputValue === currentTarget) {
        resultMessage.textContent = '正解';
        resultMessage.style.color = '#28a745';

        // 次の問題に進む
        currentIndex = currentIndex + 1;
        if (currentIndex >= sentences.length) {
          currentIndex = 0;
        }
        displaySentence();
      } else {
        resultMessage.textContent = '不正解';
        resultMessage.style.color = '#dc3545';
        renderCharColors(); // 不正解時にも色の状態を確定描画
      }
    }

    // 起動時に自動でデータを読み込み
    document.addEventListener('DOMContentLoaded', function() {
      loadSentence();
    });

    // 入力時に一文字ずつリアルタイムで判定・着色
    userInput.addEventListener('input', function() {
      resultMessage.textContent = '';
      renderCharColors();
    });

    // キー入力イベント
    userInput.addEventListener('keydown', function(event) {
      // IME変換中のEnterは無視
      if (event.isComposing || event.keyCode === 229) {
        return;
      }

      // 確定時のEnterキー押下で判定を実行
      if (event.key === 'Enter') {
        event.preventDefault();
        checkAnswer();
      }
    });
  </script>
</body>
</html>
