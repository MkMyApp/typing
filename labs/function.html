<!---5----10---15---20---25---30---35---40--->
<textarea id="txtdata" hidden>
</textarea>
<!---5----10---15---20---25---30---35---40--->

<script>
	// 関数の実行結果をtextareaに代入
	function makeWord() {
	    let word = 'test'+ Math.floor(Math.random() * 100);
	    return word;
	}

	function makeWords() {
	    let words = '';
	    for (let i = 0; i < 100; i++) {
	        words = words + makeWord() + '\n';
	    }
	    return words;
	}

	document.getElementById('txtdata').value = makeWords();
	const IME = 'OFF';
</script>
