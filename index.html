<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
#frm_type {
  width: 100%;
  height: 450px;
  border: none;
  white-space: normal;
  margin: 0 auto;
  padding: 0;
}

#frm_menu {
  width: 640px;
  height:320px;
  padding: 20px;
  display: block;
  text-align: center;
  display: block;
  margin: 0px auto;
  border: none;
  font-size: 24px;
  line-height: 1em;
}

</style>
<title>タイピング練習</title>
</head>
<body>
<img src="type.png" onclick="location.reload();" style="display: block; margin: 0 auto; width: 640px; cursor: pointer;">

<iframe id="frm_type"></iframe>

<script>
const menuList = [
'ABC小文字',
'ABC大文字',
'あいう',
'いろは',
'ひらがな',
'初級英単語60',
]

const iframeElement = document.getElementById('frm_type');
newIndex = Math.floor(Math.random() * menuList.length);
iframeElement.src = "sample/" + menuList[newIndex] + ".html";

</script>
<iframe id="frm_menu" src="menu.html"></iframe>
</body>

</html>
