<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="custom.css">
<title>問題作成</title>
</head>
<body>
<script>
  let START_MSG = "Enter⏎でスタート"
  let INPUT_MSG = "英数 かな"
  let RANDOM = 10
  let WIDTH = "25ch"
  
  function showSettings() {
  const customDiv = document.getElementById("custom");
  customDiv.style.display = "";
  const typeDiv = document.getElementById("type");
  typeDiv.style.display = "none";

  }

  function updateSettings() {
  START_MSG = document.getElementById("START_MSG").value;
  INPUT_MSG = document.getElementById("INPUT_MSG").value;
  RANDOM    = Number(document.getElementById("RANDOM").value);
  WIDTH     = document.getElementById("WIDTH").value;

  init();
  
  const customDiv = document.getElementById("custom");
  customDiv.style.display = "none";
  const typeDiv = document.getElementById("type");
  typeDiv.style.display = "";

  const editor = document.getElementById("editor");
  editor.focus();
  }
</script>
<div id="custom">
	<div id="setTitle">
		<button id="setButton" onclick="updateSettings()">問題設定</button>
  </div>
	<div id="set">
		開　始：<input id="START_MSG" value="Enter⏎でスタート"><br>
		文字種：<input id="INPUT_MSG" value="英数 かな"><br>
		問題数：<input id="RANDOM" value="10"><br>
		文字幅：<input id="WIDTH" value="25ch"><br>
	</div>
	<div id="text">
		<span id="ruler" class="line">
		+----5----10---15---20---25---30---35---40
		</span>
		<textarea id="txtdata"></textarea>
		<span id="ruler" class="line">
		+----5----10---15---20---25---30---35---40
		</span>
	</div>
</div>
<div id="type" style="display: none;">
  <div id="title" onclick="showSettings()"></div>
  <div id="result"></div>
  <div id="target" class="line" 
    style="text-align:center"></div>
  <textarea id="editor" class="line" 
    spellcheck="false" rows="1">
  </textarea>
</div>
<script src="typing.js" defer></script>
<div id="exp">
練習問題を入力
問題設定のボタンをクリックして
タイピング練習をする。
タイトルをクリックすると
問題設定にもどる。

</div>
</body>
</html>
