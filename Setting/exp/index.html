<div id="exp">
① テキストエリアにフォーカス<br>
② 文字種を確認<br>
③ Enterでスタート<br>
④ Shift+Enterで次の問題に進む<br>
<br>
<img src="英数.png" style="height:2.5em;"> かな漢字変換なし 直接入力<br>
<img src="かな.png" style="height:2.5em;"> かな漢字変換あり 変換してEnterで確定<br>
カタカナはCtrl+iで変換
<hr>
全画面化がおすすめ <img src="F3.png" style="height:2em;"><br>
画面の拡大・縮小<br>
Ctrl ＋ ⌨️[＋] [－] [０]<br>
Ctrl ＋ 🖱️↕️マウスホイール<br>
<br>
<img src="F1.png" style="height:2em;"><img src="BB.png" style="height:2em;">前のページにもどる<br>
Ctrl+<img src="F2.png" style="height:2em;"><img src="BR.png" style="height:2em;">強制リロード<br>
