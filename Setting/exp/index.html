<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
body {
	border: none;
	font-size: 24px;
	line-height: 2em;
	width:640px;
	padding: 10px;
	margin: 20px auto 20px;
	white-space: pre-wrap;
}

a {
	color:#000000;
	text-decoration: none;
}

a:hover {
	color: blue;
}

.box {
  width: 600px;
  padding: 8px;
  white-space: left;
  text-align: left;
  margin: 0px 0px 10px 20px;
  border: solid 1px #e0e0e0;
  font-size: 24px;
  }
  </style>
</head>
<body>
<h1>タイピング練習の操作方法</h1>
<div class="box">
① テキストエリアにフォーカス
② 文字種を確認
③ Enterでスタート
④ Shift+Enterで次の問題に進む
</div>
<div class="box">
<img src="英数.png" style="height:2.5em;"> かな漢字変換なし 直接入力
<img src="かな.png" style="height:2.5em;"> かな漢字変換あり 変換してEnterで確定
カタカナ Ctrl+iで変換
Shift+CapsLock アルファベット大文字
</div>
<div class="box">
<img src="F3.png" style="height:2em;">全画面化
画面の拡大・縮小
Ctrl ＋ ⌨️[＋] [－] [０]
Ctrl ＋ 🖱️↕️マウスホイール
</div>
<div class="box">
<img src="F1.png" style="height:2em;"><img src="BB.png" style="height:2em;">前のページにもどる
Ctrl+<img src="F2.png" style="height:2em;"><img src="BR.png" style="height:2em;">強制リロード</div>
</body>
</html>
