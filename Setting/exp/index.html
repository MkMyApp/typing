<head>

	<title>タイピング練習</title>
	<style>
	.box {
  width: 600px;
  padding: 8px;
  white-space: left;
  text-align: left;
  margin: 0px 0px 10px 20px;

<body>
<h1>タイピング練習の操作方法</h1>
<div class="box">
① テキストエリアにフォーカス<br>
② 文字種を確認<br>
③ Enterでスタート<br>
④ Shift+Enterで次の問題に進む<br>
</div>
<div class="box">
<img src="英数.png" style="height:2.5em;"> かな漢字変換なし 直接入力<br>
<img src="かな.png" style="height:2.5em;"> かな漢字変換あり 変換してEnterで確定<br>
カタカナ Ctrl+iで変換<br>
Shift+CapsLock アルファベット大文字<br>
</div>
</div>
<div class="box"><img src="F3.png" style="height:2em;">全画面化<br>
画面の拡大・縮小<br>
Ctrl ＋ ⌨️[＋] [－] [０]<br>
Ctrl ＋ 🖱️↕️マウスホイール<br>
</div>
<div class="box">
<img src="F1.png" style="height:2em;"><img src="BB.png" style="height:2em;">前のページにもどる<br>
Ctrl+<img src="F2.png" style="height:2em;"><img src="BR.png" style="height:2em;">強制リロード</div>
