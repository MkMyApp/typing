<script>
function generateTypingWord() {
		const firstChars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわがぎぐげござじずぜぞだづでどばびぶべぼぱぴぷぺぽ";

    // 2文字目: 「を」および小文字を除外
    const secondChars = "ん" + firstChars; 

    const char1 = firstChars[Math.floor(Math.random() * firstChars.length)];
    const char2 = secondChars[Math.floor(Math.random() * secondChars.length)];
    return char1 + char2 + char1 + char2;
}

window.addEventListener('DOMContentLoaded', () => {
    let words = "";
    for (let i = 0; i < 100; i++) {
        words =words + generateTypingWord() + '\n'
    }
    document.getElementById('txtdata').value = words;
    init();
});
</script>
