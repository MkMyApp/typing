<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <meta http-equiv="refresh" content="3; url=index.html">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      color: #666666;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 80px;
      font-weight: 300;
      color: #222222;
      line-height: 1;
      margin-bottom: 24px;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .redirect-notice {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .redirect-link {
      color: #0366d6;
      font-size: 16px;
      text-decoration: underline;
      margin-bottom: 48px;
    }

    .redirect-link:hover {
      color: #0056b3;
    }

  </style>
</head>
<body>

<div class="container">
  <h1>404</h1>
  <div class="message">
    <p>page not found.</p>
    <p>ページは存在しないか・移動しています。</p>
  </div>
  <p class="redirect-notice">3秒後にトップページへリダイレクトします。</p>
  <a href="index.html" class="redirect-link">ここをクリック</a>
</div>

</body>
</html>
