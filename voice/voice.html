<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>音声出力</title>
<style>
body {
text-align: center;
}

h1 {
 font-size:48px;
 color: #333;
}

#editor {
    font-family: monospace;
    font-size: 24px;
    width: 640px;
    height: 64px;
}
</style>
</head>
<body>
<h1>音声タイピング</h1>
<textarea id="editor"></textarea>
<p>
アルファベットをタイプすると発声します。<br>
Shift+Enterで、日本語で発声します。<br>
Ctrl+Sでhtmlファイルを保存し<br>
タイピング練習に移植して利用します。
</p>

<script>
//const subject = window
const subject = document.getElementById('editor');

subject.addEventListener('keydown', (event) => {
    // Shift + Enter が押されたか判定
    if (event.key === 'Enter' && event.shiftKey) {
        event.preventDefault();
        //speak_en(subject.value);
        speak_jp(subject.value);
        return;
    }
    //半角文字の発音
    const key = event.key;
    if (/^[ -~]$/.test(key)) {
        speak_en(key);
    }
});

function speak(text, lang, rate) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = rate;
    window.speechSynthesis.speak(utterance);
}

function speak_jp(text) {
    speak(text, 'ja-JP', 1);
}

function speak_en(text) {
    speak(text, 'en-US', 1);
}
</script>

</body>
</html>
